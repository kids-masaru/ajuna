<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雪山ドットシューティング - バランス調整版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c101a; 
            color: white;
            font-family: sans-serif;
            touch-action: none; 
        }

        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            overflow: hidden;
            background-color: #0c1226;
        }

        #gameCanvas {
            display: block;
        }

        .title-text {
            background: linear-gradient(to bottom, #ffffff, #7dd3fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8);
        }

        /* Home Button */
        .home-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.5);
            font-size: 1.8rem;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .home-btn:active {
            transform: scale(0.9);
        }

        @keyframes flashWarning {
            0% { opacity: 1; color: #ef4444; }
            50% { opacity: 0; }
            100% { opacity: 1; color: #facc15; }
        }
        .warning-text {
            animation: flashWarning 0.5s infinite;
        }

        /* Tailwindが読めなかったときでも画面が隠れるように */
        #startScreen.hidden,
        #gameOverScreen.hidden {
            display: none !important;
        }
    </style>
    <link rel="stylesheet" href="assets/kit.css">
</head>
<body class="gp gp-indigo gp-dark">

    <audio id="bgm" src="suno.mp3" loop></audio>

    <div id="game-wrapper">
        <a href="index.html" class="gp-home" aria-label="ホームにもどる">🏠</a>
        <canvas id="gameCanvas"></canvas>

        <div id="startScreen" class="gp-cover absolute inset-0 flex flex-col justify-center items-center z-20 px-4 text-center">
            <div class="gp-hero gp-float mb-6">❄️</div>
            <h1 class="gp-title title-text mb-4 text-white">ICE BEAM SHOOTER</h1>
            <p class="mb-12 text-gray-200 text-sm md:text-lg drop-shadow-md leading-relaxed">
                画面をタッチして指を動かすと移動<br>
                （タッチしている間、こおりのビームが出ます）<br>
                <span class="text-pink-300">💗ハートでHPかいふく！</span><br>
                <span class="text-yellow-300">⭐ほしでとくてんアップ！</span><br>
                <span class="text-sky-300">💎ジェムでビームがつよくなる！（さいだい3本）</span>
            </p>
            <div id="startBtn" class="text-white text-lg font-bold opacity-80">よみこみちゅう…</div>
        </div>

        <div id="gameOverScreen" class="gp-cover hidden absolute inset-0 flex flex-col justify-center items-center z-20">
            <h1 id="resultTitle" class="text-6xl md:text-8xl font-bold mb-4 text-red-500">GAME OVER</h1>
            <p class="text-4xl mb-8 text-white">SCORE: <span id="finalScore" class="text-yellow-400">0</span></p>
            <button id="restartBtn" class="gp-btn">もう一度プレイ</button>
        </div>
    </div>

<script>
    const wrapper = document.getElementById('game-wrapper');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalScoreEl = document.getElementById('finalScore');
    const resultTitle = document.getElementById('resultTitle');
    const bgm = document.getElementById('bgm');

    // ==========================================
    // 1. 画像の読み込み
    // ==========================================
    startBtn.disabled = true;

    // スプライトアトラス（1枚の画像に全素材をまとめてある）
    const ATLAS = {"castle":[[0,0,349,320]],"special":[[353,0,209,256]],"treeL":[[566,0,142,254]],"run":[[1096,0,179,194],[1279,0,166,193],[712,0,177,196],[1449,0,158,193],[893,0,199,195],[1693,0,191,190],[0,324,196,187]],"lamp":[[1611,0,78,192]],"treeM":[[200,324,93,166]],"flag":[[297,324,108,163]],"boss":[[569,324,177,152],[409,324,156,159]],"snowman":[[750,324,157,148],[1091,324,163,146],[1258,324,167,146]],"burst":[[911,324,176,147]],"sign":[[1429,324,102,134]],"treeS":[[1535,324,77,132]],"snowmanDead":[[1616,324,160,131]],"deadTree":[[1780,324,142,125]],"chest":[[0,515,131,121]],"ghostDead":[[135,515,100,119]],"statue":[[239,515,186,119]],"snow":[[429,515,91,106],[102,640,70,81],[595,640,61,72],[1359,640,32,35],[1395,640,22,23]],"ghost":[[788,515,112,96],[524,515,141,102],[1060,515,135,95],[669,515,115,98],[1199,515,115,91],[1318,515,116,90]],"icicle":[[904,515,152,96]],"heart":[[1438,515,61,90]],"gem":[[1503,515,54,88]],"ice":[[1274,640,81,49],[466,640,125,74],[1561,515,129,87]],"star":[[384,640,78,75],[1883,515,83,83],[1694,515,88,87]],"iceBlock":[[176,640,84,80],[1786,515,93,86]],"platS":[[940,640,78,63],[0,640,98,82]],"iceDrip":[[264,640,116,77]],"platM":[[660,640,189,69]],"cloud":[[853,640,83,67]],"platL":[[1022,640,248,59]]};

    const sheet = new Image();
    sheet.onload = () => { beginGame(); };
    sheet.onerror = () => { beginGame(); };
    sheet.src = 'yuki_atlas.png';

    // 高さ h に合わせて (cx, cy) を中心に描く（アスペクト比は保持）
    function drawSprite(name, k, cx, cy, h, opt) {
        const list = ATLAS[name];
        const f = list[((k % list.length) + list.length) % list.length];
        const w = f[2] * (h / f[3]);
        opt = opt || {};
        const a = opt.alpha === undefined ? 1 : opt.alpha;
        const rot = opt.rot || 0;
        if (a !== 1 || rot) {
            ctx.save();
            if (a !== 1) ctx.globalAlpha = a;
            if (rot) { ctx.translate(cx, cy); ctx.rotate(rot); ctx.translate(-cx, -cy); }
            ctx.drawImage(sheet, f[0], f[1], f[2], f[3], cx - w / 2, cy - h / 2, w, h);
            ctx.restore();
        } else {
            ctx.drawImage(sheet, f[0], f[1], f[2], f[3], cx - w / 2, cy - h / 2, w, h);
        }
        return w;
    }
    // 左上基準で高さ h に合わせて描く（地面に置く背景物向け）
    function drawSpriteBottom(name, k, cx, bottomY, h, alpha) {
        drawSprite(name, k, cx, bottomY - h / 2, h, { alpha: alpha });
    }
    function spriteWidth(name, k, h) {
        const list = ATLAS[name];
        const f = list[((k % list.length) + list.length) % list.length];
        return f[2] * (h / f[3]);
    }

    // ==========================================
    // 2. 効果音 (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function getACtx() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
    }

    function playShoot() {
        const ac = getACtx();
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.connect(g); g.connect(ac.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(900, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ac.currentTime + 0.08);
        g.gain.setValueAtTime(0.06, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
        osc.start(); osc.stop(ac.currentTime + 0.08);
    }

    function playEnemyHit() {
        const ac = getACtx();
        const len = Math.floor(ac.sampleRate * 0.15);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1);
        const src = ac.createBufferSource(), g = ac.createGain();
        src.buffer = buf; src.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.25, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.15);
        src.start(); src.stop(ac.currentTime + 0.15);
    }

    function playPlayerHit() {
        const ac = getACtx();
        const osc = ac.createOscillator(), g = ac.createGain();
        osc.connect(g); g.connect(ac.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, ac.currentTime + 0.35);
        g.gain.setValueAtTime(0.3, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.35);
        osc.start(); osc.stop(ac.currentTime + 0.35);
    }

    function playItemPickup() {
        const ac = getACtx();
        [523, 659, 784].forEach((freq, i) => {
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.connect(g); g.connect(ac.destination);
            osc.type = 'sine';
            const t = ac.currentTime + i * 0.07;
            osc.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.15, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.start(t); osc.stop(t + 0.18);
        });
    }

    function playBossAppear() {
        const ac = getACtx();
        [400, 800, 400, 800].forEach((freq, i) => {
            const osc = ac.createOscillator(), g = ac.createGain();
            osc.connect(g); g.connect(ac.destination);
            osc.type = 'square';
            const t = ac.currentTime + i * 0.18;
            osc.frequency.setValueAtTime(freq, t);
            g.gain.setValueAtTime(0.2, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
            osc.start(t); osc.stop(t + 0.15);
        });
    }

    function playBossDeath() {
        const ac = getACtx();
        const len = Math.floor(ac.sampleRate * 1.2);
        const buf = ac.createBuffer(1, len, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
        const src = ac.createBufferSource(), g = ac.createGain();
        src.buffer = buf; src.connect(g); g.connect(ac.destination);
        g.gain.setValueAtTime(0.5, ac.currentTime);
        src.start(); src.stop(ac.currentTime + 1.2);
        const osc = ac.createOscillator(), og = ac.createGain();
        osc.connect(og); og.connect(ac.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, ac.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, ac.currentTime + 1.2);
        og.gain.setValueAtTime(0.4, ac.currentTime);
        og.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 1.2);
        osc.start(); osc.stop(ac.currentTime + 1.2);
    }

    // ==========================================
    // 3. ゲームシステム本体
    // ==========================================
    let isGameStarted = false; 
    let gameState = 'start'; 
    let score = 0;
    let frameCount = 0;
    let animationId;
    
    let player;
    let bullets = [];
    let enemies = [];
    let enemyBullets = []; // 敵の弾
    let items = []; // 回復アイテム
    let particles = [];
    let bgScrollX = 0;

    let powerLevel = 1;
    let powerBonus = 0;   // ジェムで増えるパワー
    let corpses = [];     // 倒された敵の演出
    let snowFlakes = [];  // 背景に降る雪
    let isBossActive = false;
    let boss = null;
    let warningTimer = 0;
    let lastTime = 0;
    let enemySpawnTimer = 0;
    let itemSpawnTimer = 0;

    function applyOrientation() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const isPortrait = h > w;

        if (isGameStarted && isPortrait) {
            wrapper.style.width = h + 'px';
            wrapper.style.height = w + 'px';
            wrapper.style.transform = `rotate(90deg) translateY(-${w}px)`;
            wrapper.style.transformOrigin = '0 0';
            canvas.width = h; canvas.height = w;
        } else {
            wrapper.style.width = w + 'px';
            wrapper.style.height = h + 'px';
            wrapper.style.transform = 'none';
            canvas.width = w; canvas.height = h;
        }
    }
    window.addEventListener('resize', applyOrientation);
    applyOrientation();

    function getTouchPos(e) {
        const t = e.touches[0];
        const w = window.innerWidth;
        const h = window.innerHeight;
        return (isGameStarted && h > w) ? { x: t.clientY, y: w - t.clientX } : { x: t.clientX, y: t.clientY };
    }

    const touchState = { active: false, x: 0, y: 0, lastX: 0, lastY: 0 };
    
    canvas.addEventListener('touchstart', (e) => {
        if (gameState !== 'playing') return; e.preventDefault();
        touchState.active = true;
        const pos = getTouchPos(e);
        touchState.x = touchState.lastX = pos.x; 
        touchState.y = touchState.lastY = pos.y;
    }, {passive: false});
    
    canvas.addEventListener('touchmove', (e) => {
        if (gameState !== 'playing') return; e.preventDefault();
        const pos = getTouchPos(e);
        touchState.x = pos.x; 
        touchState.y = pos.y;
    }, {passive: false});
    
    canvas.addEventListener('touchend', () => touchState.active = false);
    canvas.addEventListener('touchcancel', () => touchState.active = false);

    // ==========================================
    // キャラクタークラス群
    // ==========================================
    class Player {
        constructor() {
            this.height = 86;
            this.width = this.height * 0.62;   // 当たり判定は体の幅だけ（髪や杖は含めない）
            this.x = 60;
            this.y = canvas.height / 2 - this.height / 2;
            this.cooldown = 0;
            this.hp = 5;       // ★自機の体力
            this.maxHp = 5;
            this.invincible = 0; // 無敵時間（被弾後）
            this.animT = 0;
        }
        draw() {
            // 無敵時間中は点滅させる
            if (this.invincible > 0 && Math.floor(this.invincible / 5) % 2 === 0) return;
            const cx = this.x + this.width / 2;
            const cy = this.y + this.height / 2;
            const bob = Math.sin(this.animT * 0.18) * 3;   // ふわふわ浮遊
            if (this.invincible > 0) {
                // 被弾直後は必殺技ポーズ（雪の輪に包まれる）
                drawSprite('special', 0, cx, cy + bob, this.height * 1.25);
            } else {
                drawSprite('run', Math.floor(this.animT / 6), cx, cy + bob, this.height);
            }
        }
        update(dt) {
            if (this.invincible > 0) this.invincible -= dt;
            this.animT += dt;

            if (touchState.active) {
                this.x += (touchState.x - touchState.lastX);
                this.y += (touchState.y - touchState.lastY);
                this.x = Math.max(0, Math.min(canvas.width / 2, this.x));
                this.y = Math.max(0, Math.min(canvas.height - this.height, this.y));
                touchState.lastX = touchState.x; 
                touchState.lastY = touchState.y;

                if (this.cooldown <= 0) {
                    playShoot();
                    const bx = this.x + this.width + 10;
                    const by = this.y + this.height/2;
                    
                    // ★攻撃パターンを修正（最高3本）
                    if (powerLevel === 1) {
                        // 1本
                        bullets.push(new Bullet(bx, by, 0, 5));
                    } else if (powerLevel === 2) {
                        // 2本（上下に平行）
                        bullets.push(new Bullet(bx, by - 8, 0, 5));
                        bullets.push(new Bullet(bx, by + 8, 0, 5));
                    } else {
                        // 3本（拡散）
                        bullets.push(new Bullet(bx, by, 0, 5));
                        bullets.push(new Bullet(bx, by, -0.8, 5));
                        bullets.push(new Bullet(bx, by, 0.8, 5));
                    }
                    this.cooldown = 18; 
                }
            }
            if (this.cooldown > 0) this.cooldown -= dt;
        }

        // ★ダメージを受ける処理
        takeDamage() {
            if (this.invincible <= 0) {
                playPlayerHit();
                this.hp--;
                this.invincible = 60; // 約1秒無敵
                for(let k=0; k<15; k++) particles.push(new Particle(this.x+this.width/2, this.y+this.height/2, '#ef4444'));
                
                if (this.hp <= 0) {
                    gameState = 'over';
                }
            }
        }
    }

    class Bullet {
        constructor(x, y, vy, size) {
            this.x = x; this.y = y; this.w = size; this.vx = 5; this.vy = vy; this.age = 0;
        }
        draw() {
            // パワーレベルが上がるほど大きい氷弾になる
            const k = powerLevel >= 3 ? 2 : (powerLevel === 2 ? 1 : 0);
            const h = Math.min(22 + this.age * 0.25, 34);   // 飛ぶほど少しだけ伸びる（伸びすぎ防止）
            drawSprite('ice', k, this.x, this.y, h, { rot: Math.atan2(this.vy, this.vx) });
        }
        update(dt) {
            this.x += this.vx * dt; this.y += this.vy * dt; this.age += dt;
            this.w = Math.min(this.w + 0.05 * dt, 11);      // 当たり判定の上限
            if (this.x > canvas.width) this.del = true;
        }
    }

    // ★敵の弾
    class EnemyBullet {
        constructor(x, y, vx, vy) {
            this.x = x; this.y = y; this.w = 6; this.vx = vx; this.vy = vy; this.del = false;
        }
        draw() {
            ctx.fillStyle = '#facc15'; // 黄色い弾
            ctx.beginPath(); ctx.arc(this.x, this.y, this.w, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#ef4444';
            ctx.beginPath(); ctx.arc(this.x, this.y, this.w/2, 0, Math.PI*2); ctx.fill();
        }
        update(dt) {
            this.x += this.vx * dt; this.y += this.vy * dt;
            if (this.x < -20 || this.x > canvas.width + 20 || this.y < -20 || this.y > canvas.height + 20) {
                this.del = true;
            }
        }
    }

    class Enemy {
        constructor() {
            this.type = Math.random() < 0.5 ? 1 : 2;   // 1=そらとぶオバケ / 2=ゆきだるま
            if (this.type === 1) {
                this.h = 54; this.w = 58; this.speed = 3.0; this.hp = 2;
            } else {
                this.h = 66; this.w = 62; this.speed = 2.1; this.hp = 4;
            }
            this.x = canvas.width;
            this.y = Math.random() * (canvas.height - this.h);
            this.baseY = this.y;
            this.animT = Math.random() * 60;
            this.del = false;
        }
        draw() {
            const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
            if (this.type === 1) {
                // 前を向いた4コマだけでパタパタさせる
                drawSprite('ghost', Math.floor(this.animT / 7) % 4, cx, cy, this.h);
            } else {
                drawSprite('snowman', Math.floor(this.animT / 12), cx, cy, this.h);
            }
        }
        update(dt) {
            this.x -= this.speed * dt;
            this.animT += dt;
            // オバケはふわふわ上下に揺れながら飛ぶ
            if (this.type === 1) {
                this.y = this.baseY + Math.sin(this.animT * 0.06) * 26;
            }
            if (this.x < -this.w) this.del = true;
        }
        // 倒されたときの死にスプライト
        corpse() {
            return new Corpse(this.type === 1 ? 'ghostDead' : 'snowmanDead',
                              this.x + this.w / 2, this.y + this.h / 2, this.h * 1.15);
        }
    }

    // 倒された敵がくるっと落ちて消える演出
    class Corpse {
        constructor(name, x, y, h) {
            this.name = name; this.x = x; this.y = y; this.h = h;
            this.vx = -1.5; this.vy = -2.5; this.rot = 0; this.life = 45;
        }
        draw() {
            drawSprite(this.name, 0, this.x, this.y, this.h,
                       { alpha: Math.min(1, this.life / 25), rot: this.rot });
        }
        update(dt) {
            this.x += this.vx * dt; this.y += this.vy * dt;
            this.vy += 0.22 * dt; this.rot += 0.05 * dt; this.life -= dt;
        }
    }

    class Boss {
        constructor() {
            this.w = 216;
            this.h = 180;
            this.x = canvas.width;
            this.y = canvas.height/2 - this.h/2;
            this.hp = 150; // ボスを少しタフに
            this.maxHp = 150;
            this.phase = "enter";
            this.baseY = this.y;
            this.angle = 0;
            this.attackTimer = 60; // ★攻撃タイマー
        }
        draw() {
            const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
            // 足元に氷の渦を描いて「ボスらしさ」を出す
            ctx.save();
            ctx.globalAlpha = 0.5;
            drawSprite('burst', 0, cx, cy, this.h * 1.5, { rot: this.angle * 1.5 });
            ctx.restore();
            drawSprite('boss', Math.floor(this.angle * 4), cx, cy, this.h);

            // HPバー
            ctx.fillStyle = 'red';
            ctx.fillRect(this.x, this.y - 15, this.w, 8);
            ctx.fillStyle = 'green';
            ctx.fillRect(this.x, this.y - 15, this.w * (this.hp/this.maxHp), 8);
        }
        update(dt) {
            if (this.phase === "enter") {
                this.x -= 2 * dt;
                if (this.x < canvas.width - this.w - 20) this.phase = "attack";
            } else {
                this.angle += 0.03 * dt;
                this.y = this.baseY + Math.sin(this.angle) * 60;

                // ★ボスの攻撃処理
                this.attackTimer -= dt;
                if (this.attackTimer <= 0) {
                    const cx = this.x + 10;
                    const cy = this.y + this.h / 2;
                    
                    // 自機を狙う角度を計算
                    const dx = (player.x + player.width/2) - cx;
                    const dy = (player.y + player.height/2) - cy;
                    const dist = Math.hypot(dx, dy);
                    const vx = (dx / dist) * 4;
                    const vy = (dy / dist) * 4;
                    
                    // 3WAY弾
                    enemyBullets.push(new EnemyBullet(cx, cy, vx, vy));
                    enemyBullets.push(new EnemyBullet(cx, cy, vx - 1, vy - 1));
                    enemyBullets.push(new EnemyBullet(cx, cy, vx - 1, vy + 1));
                    
                    this.attackTimer = 100; // 次の攻撃までの間隔
                }
            }
        }
    }

    // ★回復アイテム
    class Item {
        constructor() {
            const r = Math.random();
            // ハート=かいふく / ほし=とくてん / ジェム=パワーアップ
            this.kind = r < 0.50 ? 'heart' : (r < 0.85 ? 'star' : 'gem');
            this.w = 38;
            this.h = 38;
            this.x = canvas.width;
            this.y = Math.random() * (canvas.height - this.h);
            this.speed = 2;
            this.animT = 0;
            this.del = false;
        }
        draw() {
            const cx = this.x + this.w / 2, cy = this.y + this.h / 2;
            const pulse = 1 + Math.sin(this.animT * 0.12) * 0.12;
            if (this.kind === 'star') {
                drawSprite('star', Math.floor(this.animT / 10), cx, cy, this.h * pulse);
            } else if (this.kind === 'gem') {
                drawSprite('gem', 0, cx, cy, this.h * 1.1 * pulse);
            } else {
                drawSprite('heart', 0, cx, cy, this.h * pulse);
            }
        }
        update(dt) {
            this.x -= this.speed * dt;
            this.animT += dt;
            this.y += Math.sin(frameCount * 0.05) * 1;
            if (this.x < -this.w) this.del = true;
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y; this.size = Math.random() * 4 + 1; 
            this.vx = Math.random() * 8 - 4; this.vy = Math.random() * 8 - 4;
            this.color = color; this.life = 30;
        }
        draw() {
            ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill();
        }
        update(dt) { this.x += this.vx * dt; this.y += this.vy * dt; this.life -= dt; }
    }

    // ==========================================
    // 背景（そら・氷の城・木・地面・ふる雪）
    // ==========================================
    // 同じ i なら毎回おなじ値を返す疑似乱数（背景がチラつかないように）
    function frand(i, salt) {
        const v = Math.sin(i * 127.1 + (salt || 0) * 311.7) * 43758.5453;
        return v - Math.floor(v);
    }

    // factor ぶんだけゆっくり流れる背景レイヤーを敷き詰める
    function tileLayer(factor, spacing, cb) {
        const worldX = bgScrollX * factor;
        const first = Math.floor(worldX / spacing) - 1;
        for (let i = first; ; i++) {
            const sx = i * spacing - worldX;
            if (sx > canvas.width + spacing) break;
            cb(sx, i);
        }
    }

    function drawBackground(dt) {
        const H = canvas.height, W = canvas.width;
        const groundY = H * 0.94;

        // そら
        const sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#0e2a55');
        sky.addColorStop(0.45, '#2f6fae');
        sky.addColorStop(0.78, '#7fb8e0');
        sky.addColorStop(1, '#cfe9fa');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        // くも（いちばん奥）
        tileLayer(0.10, 340, (sx, i) => {
            const h = H * (0.05 + frand(i, 1) * 0.04);
            drawSprite('cloud', 0, sx, H * (0.08 + frand(i, 2) * 0.32), h, { alpha: 0.92 });
        });

        // 氷のお城
        tileLayer(0.22, 980, (sx, i) => {
            const h = H * 0.40;
            drawSpriteBottom('castle', 0, sx, groundY, h, 0.85);
        });

        // 奥の木
        tileLayer(0.42, 250, (sx, i) => {
            const r = frand(i, 3);
            const name = r < 0.5 ? 'treeL' : (r < 0.8 ? 'treeM' : 'deadTree');
            drawSpriteBottom(name, 0, sx, groundY + 4, H * (0.20 + frand(i, 4) * 0.09), 0.8);
        });

        // 地面（氷の足場をならべる）
        const gh = H * 0.085;
        const plW = spriteWidth('platL', 0, gh);
        tileLayer(1.0, plW, (sx) => {
            drawSpriteBottom('platL', 0, sx + plW / 2, H + gh * 0.30, gh);
        });

        // 手前のかざり（木・街灯・はた・かんばん・雪だるまの像など）
        const DECOR = ['treeS', 'lamp', 'flag', 'sign', 'statue', 'iceBlock', 'icicle', 'chest'];
        tileLayer(1.0, 210, (sx, i) => {
            const r = frand(i, 5);
            if (r > 0.62) return;                       // すきまを作る
            const name = DECOR[Math.floor(frand(i, 6) * DECOR.length) % DECOR.length];
            drawSpriteBottom(name, 0, sx, groundY + gh * 0.35, H * (0.09 + frand(i, 7) * 0.05), 0.95);
        });

        // ふる雪
        if (snowFlakes.length === 0) {
            for (let i = 0; i < 34; i++) {
                snowFlakes.push({
                    x: Math.random() * W, y: Math.random() * H,
                    h: 6 + Math.random() * 16, k: Math.floor(Math.random() * 5),
                    vx: -(0.8 + Math.random() * 1.6), vy: 0.3 + Math.random() * 0.8,
                    rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.04,
                    a: 0.35 + Math.random() * 0.5
                });
            }
        }
        for (const s of snowFlakes) {
            s.x += s.vx * dt; s.y += s.vy * dt; s.rot += s.vr * dt;
            if (s.x < -20) { s.x = W + 20; s.y = Math.random() * H; }
            if (s.y > H + 20) { s.y = -20; s.x = Math.random() * W; }
            drawSprite('snow', s.k, s.x, s.y, s.h, { alpha: s.a, rot: s.rot });
        }
    }

    // ==========================================
    // 3. メインゲームループ
    // ==========================================
    function gameLoop(timestamp) {
        if (gameState !== 'playing') return;
        const rawDelta = lastTime ? timestamp - lastTime : 1000 / 120;
        lastTime = timestamp;
        const dt = Math.min(rawDelta, 50) / (1000 / 120);

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 背景（多層パララックス）
        bgScrollX += 0.9 * dt;
        ctx.imageSmoothingEnabled = true;
        drawBackground(dt);

        // パワーアップ条件（スコア＋ジェム取得ぶん、最大3方向）
        const basePower = score >= 300 ? 3 : (score >= 100 ? 2 : 1);
        powerLevel = Math.min(3, basePower + powerBonus);

        // ボス出現条件
        if (score >= 1500 && !isBossActive && !boss) {
            isBossActive = true;
            warningTimer = 180;
            enemies = [];
            items = [];
            playBossAppear();
        }

        // 自機の更新
        player.update(dt);
        player.draw();

        // 弾の更新
        bullets.forEach((b, i) => {
            b.update(dt); b.draw();
            if(b.del) bullets.splice(i, 1);
        });

        // 敵弾の更新（ボスなどが撃つ）
        enemyBullets.forEach((eb, i) => {
            eb.update(dt); eb.draw();
            // 自機との当たり判定 (円と四角の簡易判定)
            if (player.x < eb.x + eb.w && player.x + player.width > eb.x - eb.w &&
                player.y < eb.y + eb.w && player.y + player.height > eb.y - eb.w) {
                player.takeDamage();
                eb.del = true;
            }
            if (eb.del) enemyBullets.splice(i, 1);
        });
        
        // アイテムの出現と更新
        itemSpawnTimer += dt;
        if (itemSpawnTimer >= 400 && !isBossActive) {
            items.push(new Item());
            itemSpawnTimer = 0;
        }
        items.forEach((item, i) => {
            item.update(dt); item.draw();
            // 自機がアイテムを取ったか
            if (player.x < item.x + item.w && player.x + player.width > item.x &&
                player.y < item.y + item.h && player.y + player.height > item.y) {
                playItemPickup();
                let col = '#22c55e';
                if (item.kind === 'heart') {
                    player.hp = Math.min(player.maxHp, player.hp + 1);
                    score += 50;
                    col = '#f472b6';
                } else if (item.kind === 'star') {
                    score += 150;
                    col = '#facc15';
                } else {
                    powerBonus = Math.min(2, powerBonus + 1);
                    score += 100;
                    col = '#38bdf8';
                }
                item.del = true;
                for(let k=0; k<15; k++) particles.push(new Particle(item.x+item.w/2, item.y+item.h/2, col));
            }
            if (item.del) items.splice(i, 1);
        });
        
        if (isBossActive) {
            if (warningTimer > 0) {
                warningTimer -= dt;
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 40px sans-serif';
                ctx.textAlign = 'center';
                if (Math.floor(warningTimer / 15) % 2 === 0) {
                    ctx.fillText('WARNING!! BOSS APPROACHING!!', canvas.width/2, canvas.height/2);
                }
                if (warningTimer <= 0) boss = new Boss();
            }
            else if (boss) {
                boss.update(dt);
                boss.draw();
                
                // 自機の弾とボスの当たり判定
                bullets.forEach((b, j) => {
                    if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
                        boss.hp--;
                        bullets.splice(j, 1);
                        for(let k=0; k<5; k++) particles.push(new Particle(b.x, b.y, '#fcd34d'));
                    }
                });

                // 自機とボスの体当たり
                if (player.x + player.width > boss.x && player.x < boss.x + boss.w &&
                    player.y + player.height > boss.y && player.y < boss.y + boss.h) {
                    player.takeDamage();
                }

                // ボス撃破
                if (boss.hp <= 0) {
                    playBossDeath();
                    for(let k=0; k<100; k++) particles.push(new Particle(boss.x+boss.w/2, boss.y+boss.h/2, '#ef4444'));
                    score += 1000;
                    boss = null;
                    isBossActive = false;
                    enemyBullets = []; // 残った敵弾を消す
                    resultTitle.innerText = "MISSION CLEAR!!";
                    resultTitle.className = "text-6xl md:text-8xl font-bold mb-4 text-yellow-400";
                    gameState = 'over';
                }
            }
        } 
        else {
            // 通常の敵フェーズ
            enemySpawnTimer += dt;
            if (enemySpawnTimer >= 80) {
                enemies.push(new Enemy());
                enemySpawnTimer = 0;
            }
            enemies.forEach((e, i) => {
                e.update(dt); e.draw();
                
                // 自機と敵の体当たり
                if (player.x < e.x + e.w && player.x + player.width > e.x &&
                    player.y < e.y + e.h && player.y + player.height > e.y) {
                    player.takeDamage();
                    e.del = true; // ぶつかった敵は消滅
                }
                
                // 弾と敵の衝突
                bullets.forEach((b, j) => {
                    if (b.x + b.w > e.x && b.x - b.w < e.x + e.w &&
                        b.y + b.w > e.y && b.y - b.w < e.y + e.h) {
                        playEnemyHit();
                        bullets.splice(j, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            corpses.push(e.corpse());
                            enemies.splice(i, 1);
                            score += 10;
                            for(let k=0; k<8; k++) particles.push(new Particle(e.x+e.w/2, e.y+e.h/2, '#bae6fd'));
                        } else {
                            for(let k=0; k<3; k++) particles.push(new Particle(b.x, b.y, '#fbbf24'));
                        }
                    }
                });
                if (e.del) enemies.splice(i, 1);
            });
        }

        // 倒された敵の演出
        for (let i = corpses.length - 1; i >= 0; i--) {
            const c = corpses[i];
            c.update(dt); c.draw();
            if (c.life <= 0) corpses.splice(i, 1);
        }

        particles.forEach((p, i) => {
            p.update(dt); p.draw();
            if (p.life <= 0) particles.splice(i, 1);
        });

        // --- UI表示 ---
        if (gameState === 'over') {
            bgm.pause();
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        } else {
            // スコア
            ctx.fillStyle = 'white'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 76, 30);
            
            // パワーレベル
            let pText = "POWER: 1";
            if (powerLevel === 2) pText = "POWER: 2 (TWIN)";
            if (powerLevel === 3) pText = "POWER: MAX (3-WAY)";
            ctx.fillStyle = '#facc15'; ctx.font = 'bold 16px sans-serif';
            ctx.fillText(pText, 76, 55);

            // ★HP表示 (赤と緑のゲージでわかりやすく)
            ctx.fillStyle = 'white'; ctx.fillText('HP:', 76, 80);
            for(let i=0; i<player.maxHp; i++) {
                ctx.fillStyle = i < player.hp ? '#22c55e' : '#ef4444'; // 残りHPは緑、減った分は赤
                ctx.fillRect(111 + i * 25, 65, 20, 15);
            }

            frameCount++; animationId = requestAnimationFrame(gameLoop);
        }
    }

    function beginGame() {
        isGameStarted = true; applyOrientation();
        player = new Player();
        bullets = []; enemyBullets = []; enemies = []; items = []; particles = [];
        corpses = []; snowFlakes = [];
        score = 0; frameCount = 0; powerLevel = 1; powerBonus = 0; isBossActive = false; boss = null;
        lastTime = 0; enemySpawnTimer = 0; itemSpawnTimer = 0; bgScrollX = 0;
        resultTitle.innerText = "GAME OVER";
        resultTitle.className = "text-6xl md:text-8xl font-bold mb-4 text-red-500";
        
        gameState = 'playing'; startScreen.classList.add('hidden'); gameOverScreen.classList.add('hidden');
        bgm.currentTime = 0; bgm.play().catch(() => {});
        gameLoop();
    }

    // タイトル画面を出さずに、絵の用意ができたらそのまま始める。
    // 全画面と音は、ブラウザの決まりで最初にさわったときに有効にする。
    let unlocked = false;
    function unlockOnFirstTouch() {
        if (unlocked) return;
        unlocked = true;
        const doc = document.documentElement;
        if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
        else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
        getACtx().resume();
        bgm.play().catch(() => {});
        applyOrientation();
    }
    document.addEventListener('pointerdown', unlockOnFirstTouch, { once: true });
    document.addEventListener('touchstart', unlockOnFirstTouch, { once: true });

    restartBtn.addEventListener('click', () => {
        player = new Player();
        bullets = []; enemyBullets = []; enemies = []; items = []; particles = [];
        corpses = []; snowFlakes = [];
        score = 0; frameCount = 0; powerLevel = 1; powerBonus = 0; isBossActive = false; boss = null;
        lastTime = 0; enemySpawnTimer = 0; itemSpawnTimer = 0; bgScrollX = 0;
        resultTitle.innerText = "GAME OVER";
        resultTitle.className = "text-6xl md:text-8xl font-bold mb-4 text-red-500";

        gameState = 'playing'; gameOverScreen.classList.add('hidden');
        bgm.currentTime = 0; bgm.play();
        gameLoop();
    });

</script>
