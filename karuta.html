<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>わくわく かるた</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            touch-action: none;
            background-color: #fff7ed;
            user-select: none;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        button {
            font-family: inherit;
        }

        /* スタート画面 */
        #startScreen {
            position: fixed;
            inset: 0;
            background: #fff7ed;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .screen-hero {
            width: min(34vw, 190px);
            height: min(34vw, 190px);
            object-fit: contain;
            filter: drop-shadow(0 10px 10px rgba(154, 52, 18, 0.18));
        }

        .start-guide {
            color: #9a3412;
            font-size: 1rem;
            margin: 6px 0 18px;
        }

        .start-btn {
            background-color: #f97316;
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
            padding: 24px 0;
            width: 280px;
            border-radius: 999px;
            box-shadow: 0 8px 0 #c2410c;
            border: none;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #c2410c;
        }

        /* ヘッダー */
        .header-area {
            height: 34px;
            background: #ffedd5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #fb923c;
            flex-shrink: 0;
            font-size: 0.86rem;
            color: #9a3412;
            padding: 0 14px 0 64px;
        }

        .progress-pill {
            background: #fff;
            border: 2px solid #fdba74;
            border-radius: 999px;
            padding: 1px 12px;
            color: #c2410c;
        }

        /* 読み札エリア */
        .reader-area {
            height: 96px;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #fb923c;
            flex-shrink: 0;
            padding: 5px 70px 7px;
            position: relative;
        }

        .reader-text {
            font-size: clamp(0.95rem, 2.4vw, 1.18rem);
            color: #ea580c;
            font-weight: bold;
            line-height: 1.3;
            text-align: center;
            min-height: 2.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 15px;
        }

        .replay-btn {
            background: #fbbf24;
            color: #78350f;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            box-shadow: 0 4px 0 #d97706;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
        }

        .sound-mark {
            width: 18px;
            height: 18px;
            position: relative;
            display: inline-block;
        }

        .sound-mark::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            width: 6px;
            height: 7px;
            border-radius: 2px;
            background: currentColor;
        }

        .sound-mark::after {
            content: '';
            position: absolute;
            left: 5px;
            top: 3px;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-right: 8px solid currentColor;
        }

        .reader-feedback {
            position: absolute;
            right: 10px;
            bottom: 9px;
            color: #16a34a;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(4px);
            transition: 0.2s ease;
        }

        .reader-feedback.show {
            opacity: 1;
            transform: translateY(0);
        }

        .reader-feedback.try-again {
            color: #dc2626;
        }

        /* カードグリッド */
        .grid-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 12px 10px;
            overflow: hidden;
            background-color: #e7edc9;
            background-image:
                repeating-linear-gradient(90deg, rgba(96, 112, 52, 0.045) 0 1px, transparent 1px 5px),
                linear-gradient(180deg, rgba(255,255,255,0.48), transparent 38%);
            box-shadow: inset 0 4px 12px rgba(89, 70, 37, 0.08);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 150px));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 8px 16px;
            width: 100%;
            height: 100%;
            max-width: 430px;
            max-height: 100%;
            justify-content: center;
            justify-items: center;
            align-items: center;
        }

        .card {
            width: auto;
            height: 100%;
            max-width: 100%;
            max-height: 168px;
            aspect-ratio: 3 / 4;
            background-color: #fffdf4;
            background-image:
                radial-gradient(circle at 20% 24%, rgba(177, 126, 70, 0.07) 0 1px, transparent 1.4px),
                radial-gradient(circle at 76% 68%, rgba(177, 126, 70, 0.05) 0 1px, transparent 1.5px);
            background-size: 15px 17px, 19px 21px;
            border-radius: 7px;
            box-shadow: 0 4px 0 rgba(120, 83, 42, 0.18), 0 7px 12px rgba(74, 55, 31, 0.12);
            border: 3px solid #fffaf0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            min-height: 0;
            overflow: hidden;
            transition: transform 0.15s, opacity 0.25s, background-color 0.2s;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 5px;
            border: 2px solid #c2410c;
            border-radius: 3px;
            box-shadow: inset 0 0 0 1px rgba(194, 65, 12, 0.18);
            pointer-events: none;
            z-index: 4;
        }

        .card:focus {
            outline: none;
        }

        .card:focus-visible {
            outline: 3px solid #f97316;
            outline-offset: 1px;
        }

        .card.correct {
            border-color: #22c55e;
            background-color: #ecfdf0;
            z-index: 10;
            transform: scale(1.05);
        }

        .card.correct::before {
            border-color: #16a34a;
        }

        .card.taken {
            opacity: 0;
            pointer-events: none;
        }

        .card.wrong-shake {
            animation: shake 0.3s;
            border-color: #ef4444;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            75% {
                transform: translateX(4px);
            }
        }

        .card-char {
            font-size: clamp(1.05rem, 3vw, 1.45rem);
            color: #b91c1c;
            position: absolute;
            top: 8px;
            right: 10px;
            font-weight: bold;
            line-height: 1;
            z-index: 5;
            text-shadow: 0 1px #fffdf4;
        }

        .card-img {
            width: min(78%, 96px);
            height: min(62%, 96px);
            background-repeat: no-repeat;
            flex: 0 1 auto;
            margin-top: -2px;
        }

        .card-img.single-icon {
            background-size: contain;
            background-position: center;
        }

        .card-word {
            position: absolute;
            left: 9px;
            right: 9px;
            bottom: 8px;
            padding: 4px 1px 2px;
            border-top: 1px solid rgba(194, 65, 12, 0.45);
            background: rgba(255, 253, 244, 0.92);
            font-size: clamp(0.62rem, 1.9vw, 0.82rem);
            color: #7c2d12;
            line-height: 1.05;
            text-align: center;
            z-index: 2;
        }

        /* オーバーレイ */
        .full-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            z-index: 500;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .gp-home img {
            width: 30px;
            height: 30px;
            object-fit: contain;
        }

        .end-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }

        @media (orientation: landscape) {
            .card-grid {
                grid-template-columns: repeat(4, minmax(0, 118px));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                max-width: 520px;
                gap: 9px 12px;
            }

            .card-img {
                width: min(78%, 82px);
                height: min(61%, 82px);
            }

            #startScreen {
                flex-direction: row;
                gap: 34px;
            }

            .start-copy {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        @media (orientation: landscape) and (max-height: 430px) {
            .reader-area {
                height: 82px;
                padding-top: 2px;
                padding-bottom: 4px;
            }

            .reader-text {
                min-height: 2.25rem;
                line-height: 1.15;
            }

            .replay-btn {
                padding: 4px 16px;
                font-size: 0.82rem;
                box-shadow: 0 3px 0 #d97706;
            }

            .reader-feedback {
                bottom: 6px;
            }

            .screen-hero {
                width: 140px;
                height: 140px;
            }
        }
    </style>
    <link rel="stylesheet" href="assets/kit.css">
</head>

<body class="gp gp-orange gp-bg">
    <a href="index.html" class="gp-home" aria-label="ホームにもどる"><img src="ui_home_v2_256.png" alt=""></a>

    <div id="startScreen">
        <img class="screen-hero gp-float" src="icon_karuta.png" alt="かるたの え">

            <button class="gp-btn gp-btn--lg" onclick="gameStart()">はじめる！</button>

    </div>

    <div id="endScreen" class="full-overlay" style="display: none;">
        <img class="screen-hero gp-float" src="icon_karuta.png" alt="かるたの え">

    <div class="header-area"><span>わくわく かるた</span><span id="progressText" class="progress-pill">あと 8まい</span></div>

    <div class="reader-area">
        <div id="displayText" class="reader-text">...</div>
        <button id="replayBtn" class="replay-btn" style="visibility: hidden;" onclick="repeatText()"><span class="sound-mark" aria-hidden="true"></span>もういちど きく</button>
        <div id="readerFeedback" class="reader-feedback" aria-live="polite"></div>
    </div>

    <div class="grid-container">
        <div id="cardGrid" class="card-grid"></div>
    </div>

    <script>

        let currentTarget = null;

        let audioCtx = null;

        const synth = window.speechSynthesis;

        const atlasFiles = {
            animals: 'karuta_animals_atlas.png',
            vehicles: 'karuta_vehicles_atlas.png',
            produce: 'karuta_produce_atlas.png',
            nature: 'karuta_nature_atlas.png',
            things: 'karuta_things_atlas.png'
        };

        // データ順と図鑑シートのマスを対応させる
        function getIcon(index) {
            if (index <= 15) return { atlas: 'animals', cell: index };
            if (index <= 27) return { atlas: 'vehicles', cell: index - 16 };
            if (index <= 43) return { atlas: 'produce', cell: index - 28 };
            if (index <= 49) return { atlas: 'nature', cell: index - 44 };
            if (index >= 50 && index <= 53) return { atlas: 'vehicles', cell: index - 38 };
            if (index === 54) return { single: 'karuta_glasses.png' };
            if (index === 55) return { atlas: 'things', cell: 12 };
            if (index === 56) return { single: 'karuta_sun.png' };
            if (index >= 57 && index <= 61) {
                return { atlas: 'nature', cell: [8, 9, 6, 7, 10][index - 57] };
            }
            if (index >= 62 && index <= 66) return { atlas: 'nature', cell: index - 51 };
            return { atlas: 'things', cell: index - 67 };
        }

        function iconMarkup(icon) {
            if (icon.single) {
                return `<div class="card-img single-icon" style="background-image:url('${icon.single}')"></div>`;
            }
            const column = icon.cell % 4;
            const row = Math.floor(icon.cell / 4);
            const x = column * (100 / 3);
            const y = row * (100 / 3);
            return `<div class="card-img" style="background-image:url('${atlasFiles[icon.atlas]}');background-size:400% 400%;background-position:${x}% ${y}%"></div>`;
        }

        function shuffle(items) {
            const result = [...items];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function updateProgress() {
            document.getElementById('progressText').textContent = `あと ${remainingCards.length}まい`;
        }

        function showFeedback(message, isWrong = false) {
            const feedback = document.getElementById('readerFeedback');
            clearTimeout(feedbackTimer);
            feedback.textContent = message;
            feedback.classList.toggle('try-again', isWrong);
            feedback.classList.add('show');
            feedbackTimer = setTimeout(() => feedback.classList.remove('show'), 850);
        }

        // 音声読み上げ（GitHub互換）
        function speak(text) {
            try {
                synth.cancel();
                const uttr = new SpeechSynthesisUtterance(text);
                uttr.lang = 'ja-JP';
                uttr.rate = 0.95;
                const voices = synth.getVoices();
                const jpVoice = voices.find(v => v.lang.includes('ja'));
                if (jpVoice) uttr.voice = jpVoice;
                synth.speak(uttr);
            } catch (e) { console.log(e); }
        }

        // 効果音
        function playEffect(type) {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = (type === 'correct') ? 'sine' : 'triangle';
                osc.frequency.setValueAtTime((type === 'correct') ? 880 : 150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) { }
        }

        function gameStart() {
            document.getElementById('startScreen').style.display = 'none';
            initGame();
            setTimeout(() => {
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { }
                showNextPhrase();
            }, 120);
        }

        function initGame() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            // 4歳児が見つけやすい8枚に絞る
            const indexedData = masterData.map((item, index) => ({ ...item, iconIndex: index }));
            const deck = shuffle(indexedData).slice(0, 8);
            remainingCards = [...deck];
            updateProgress();

            const displayCards = shuffle(deck);
            displayCards.forEach(item => {
                const card = document.createElement('button');
                card.type = 'button';
                card.className = 'card';
                card.id = `card-${item.char}-${item.word}`;
                card.setAttribute('aria-label', `${item.word}の ふだ`);
                card.innerHTML = `
                    <div class="card-char">${item.char}</div>
                    ${iconMarkup(getIcon(item.iconIndex))}
                    <div class="card-word">${item.word}</div>
                `;
                card.onclick = () => checkCard(item);
                grid.appendChild(card);
            });
        }

        function showNextPhrase() {
            document.getElementById('replayBtn').style.visibility = 'hidden';

            if (remainingCards.length === 0) {
                document.getElementById('endScreen').style.display = 'flex';
                return;
            }

            currentTarget = remainingCards[Math.floor(Math.random() * remainingCards.length)];
            currentPhrase = currentTarget.phrases[Math.floor(Math.random() * currentTarget.phrases.length)];

            document.getElementById('displayText').textContent = currentPhrase;
            speak(currentPhrase);
            document.getElementById('replayBtn').style.visibility = 'visible';
        }

        function checkCard(item) {
            if (!currentTarget) return;
            const card = document.getElementById(`card-${item.char}-${item.word}`);
            // 文字と単語の両方でチェック
            if (item.word === currentTarget.word) {
                playEffect('correct');
                card.classList.add('correct');
                remainingCards = remainingCards.filter(c => c.word !== currentTarget.word);
                updateProgress();
                currentTarget = null;
                showFeedback('せいかい！');
                setTimeout(() => {
                    card.classList.add('taken');
                    showNextPhrase();
                }, 760);
            } else {
                playEffect('wrong');
                card.classList.add('wrong-shake');
                showFeedback('もういちど さがそう', true);
                setTimeout(() => card.classList.remove('wrong-shake'), 300);
            }
        }

        function repeatText() { if (currentPhrase) speak(currentPhrase); }
        window.onload = () => { synth.getVoices(); };
    </script>
