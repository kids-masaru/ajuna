<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>いくつあるかな</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            touch-action: manipulation;
            overscroll-behavior: none;
            background-color: #eff6ff;
            margin: 0;
            overflow: hidden;
        }

        button { font-family: inherit; }

        .count-shell {
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 10px 12px 12px;
            box-sizing: border-box;
            background: radial-gradient(circle at 50% 10%, #ffffff 0, #eff6ff 52%, #dbeafe 100%);
        }

        .count-header {
            height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .count-title {
            color: #2563eb;
            font-size: clamp(1.05rem, 3vw, 1.4rem);
            margin: 0;
        }

        .round-pill {
            margin-left: auto;
            background: #fff;
            border: 2px solid #93c5fd;
            border-radius: 999px;
            color: #1d4ed8;
            padding: 3px 13px;
            font-size: 0.86rem;
        }

        .count-card {
            flex: 1;
            min-height: 0;
            background: rgba(255,255,255,0.96);
            border: 3px solid #bfdbfe;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.13);
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            box-sizing: border-box;
        }

        .items-area {
            flex: 1;
            min-height: 0;
            border-radius: 20px;
            background: linear-gradient(145deg, #eff6ff, #dbeafe);
            border: 2px solid #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            overflow: hidden;
        }

        .items-grid {
            display: grid;
            grid-auto-rows: minmax(0, 1fr);
            justify-content: center;
            align-content: center;
            gap: clamp(4px, 1.2vw, 10px);
            width: 100%;
            height: 100%;
        }

        .count-item {
            position: relative;
            border: 3px solid transparent;
            background-color: transparent;
            border-radius: 18px;
            min-width: 0;
            min-height: 0;
            width: 100%;
            aspect-ratio: 1;
            align-self: center;
            cursor: pointer;
            transition: transform 0.15s, background-color 0.15s, border-color 0.15s;
            animation: itemIn 0.35s both;
        }

        .count-item:active { transform: scale(0.9); }
        .count-item:focus { outline: none; }
        .count-item:focus-visible { outline: 3px solid #2563eb; }

        .count-item.counted {
            background-color: #fff;
            border-color: #60a5fa;
            transform: scale(0.92);
        }

        .item-picture {
            position: absolute;
            inset: 4px;
            background-image: url('kazukazoe_items_atlas.png');
            background-size: 400% 400%;
            background-repeat: no-repeat;
        }

        .count-badge {
            position: absolute;
            top: 1px;
            right: 1px;
            z-index: 2;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: #2563eb;
            color: #fff;
            font-size: 0.96rem;
            box-shadow: 0 2px 0 #1e40af;
        }

        @keyframes itemIn {
            from { opacity: 0; transform: translateY(10px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .answer-area {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 9px;
        }

        .guide-text {
            margin: 0;
            color: #475569;
            font-size: clamp(0.88rem, 2.5vw, 1.05rem);
            text-align: center;
        }

        .number-options {
            display: flex;
            gap: clamp(12px, 4vw, 24px);
            justify-content: center;
        }

        .number-btn {
            width: clamp(68px, 19vw, 96px);
            height: clamp(58px, 14vw, 76px);
            border-radius: 20px;
            border: 3px solid #60a5fa;
            background: #fff;
            color: #1d4ed8;
            font-size: clamp(2rem, 8vw, 3rem);
            font-weight: 900;
            box-shadow: 0 6px 0 #2563eb;
            cursor: pointer;
            transition: transform 0.12s, background-color 0.12s;
        }

        .number-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #2563eb; }
        .number-btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; box-shadow: 0 6px 0 #16a34a; }
        .number-btn.wrong { animation: wrongShake 0.35s; background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

        @keyframes wrongShake {
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .count-actions {
            min-height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .reset-count-btn {
            border: 2px solid #93c5fd;
            background: #eff6ff;
            color: #1d4ed8;
            border-radius: 999px;
            padding: 5px 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .feedback-text {
            min-width: 150px;
            text-align: center;
            font-size: 1rem;
            color: #dc2626;
        }

        .feedback-text.correct { color: #16a34a; }

        .complete-screen {
            position: fixed;
            inset: 0;
            z-index: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            padding: 20px;
            text-align: center;
        }

        .complete-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .complete-picture {
            width: min(38vw, 150px);
            aspect-ratio: 1;
            background-image: url('kazukazoe_items_atlas.png');
            background-size: 400% 400%;
            background-repeat: no-repeat;
            background-position: 66.6667% 66.6667%;
            border-radius: 24px;
            filter: drop-shadow(0 10px 8px rgba(37, 99, 235, 0.18));
        }

        .complete-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }

        @media (orientation: landscape) {
            .count-card { flex-direction: row; padding: 10px 14px; }
            .items-area { flex: 1 1 62%; }
            .answer-area { flex: 0 0 35%; }
            .number-options { gap: 10px; }
            .number-btn { width: clamp(65px, 9vw, 82px); height: clamp(58px, 13vh, 72px); font-size: clamp(2rem, 6vw, 2.7rem); }
            .count-item { border-radius: 14px; }
        }
    </style>
    <link rel="stylesheet" href="assets/kit.css">
</head>

<body class="gp gp-blue">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ITEM_NAMES = [
          'りんご', 'いちご', 'みかん', 'にんじん',
          'いぬ', 'ねこ', 'うさぎ', 'ぱんだ',
          'くるま', 'あひる', 'くま', 'ぼーる',
          'ひまわり', 'けーき', 'あいす', 'きしゃ'
        ];

        const TOTAL_ROUNDS = 5;

        // 4×4の図鑑シートから指定した絵を切り出す
        const iconStyle = (cell) => {
          const column = cell % 4;
          const row = Math.floor(cell / 4);
          return {
            backgroundPosition: `${column * (100 / 3)}% ${row * (100 / 3)}%`
          };
        };

        const shuffle = (values) => {
          const result = [...values];
          for (let i = result.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [result[i], result[j]] = [result[j], result[i]];
          }
          return result;
        };

        const makeOptions = (answer) => {
          const candidates = [answer - 1, answer + 1, answer - 2, answer + 2, 1, 10]
            .filter(value => value >= 1 && value <= 10 && value !== answer);
          return shuffle([answer, ...shuffle([...new Set(candidates)]).slice(0, 2)]);
        };

        const playSound = (type) => {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ctx = new AC();
          if (type === 'correct') {
            const o1=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
            o1.type='sine'; o2.type='sine';
            o1.frequency.setValueAtTime(659.25, ctx.currentTime);
            o2.frequency.setValueAtTime(880.00, ctx.currentTime+0.15);
            g.gain.setValueAtTime(0,ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.05);
            g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.5);
            o1.connect(g); o2.connect(g); g.connect(ctx.destination);
            o1.start(ctx.currentTime); o1.stop(ctx.currentTime+0.15);
            o2.start(ctx.currentTime+0.15); o2.stop(ctx.currentTime+0.5);
          } else {
            const o=ctx.createOscillator(), g=ctx.createGain();
            o.type='sawtooth'; o.frequency.setValueAtTime(150,ctx.currentTime);
            g.gain.setValueAtTime(0,ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.05);
            g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.4);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime+0.4);
          }
        };

        function App() {
          const [targetCount, setTargetCount] = useState(0);
          const [currentItem, setCurrentItem] = useState(0);
          const [options, setOptions] = useState([]);
          const [countedOrder, setCountedOrder] = useState([]);
          const [round, setRound] = useState(1);
          const [result, setResult] = useState(null);
          const [wrongOption, setWrongOption] = useState(null);
          const [feedback, setFeedback] = useState('');
          const [complete, setComplete] = useState(false);
          const timerRef = useRef(null);

          const generateProblem = () => {
            const count = Math.floor(Math.random() * 10) + 1;
            setTargetCount(count);
            setCurrentItem(Math.floor(Math.random() * ITEM_NAMES.length));
            setOptions(makeOptions(count));
            setCountedOrder([]);
            setResult(null);
            setWrongOption(null);
            setFeedback('');
          };

          useEffect(() => {
            generateProblem();
            return () => clearTimeout(timerRef.current);
          }, []);

          const speakNumber = (number) => {
            try {
              window.speechSynthesis.cancel();
              const utterance = new SpeechSynthesisUtterance(String(number));
              utterance.lang = 'ja-JP';
              utterance.rate = 0.82;
              window.speechSynthesis.speak(utterance);
            } catch (error) {
              console.log('数字の読み上げを利用できません', error);
            }
          };

          const countItem = (index) => {
            if (result || countedOrder.includes(index)) return;
            const nextOrder = [...countedOrder, index];
            setCountedOrder(nextOrder);
            speakNumber(nextOrder.length);
          };

          const chooseAnswer = (value) => {
            if (result) return;
            clearTimeout(timerRef.current);

            if (value !== targetCount) {
              setWrongOption(value);
              setFeedback('もういちど かぞえてみよう');
              playSound('incorrect');
              timerRef.current = setTimeout(() => {
                setWrongOption(null);
                setFeedback('');
              }, 850);
              return;
            }

            setResult('correct');
            setFeedback(`せいかい！ ${targetCount}こ！`);
            playSound('correct');
            timerRef.current = setTimeout(() => {
              if (round >= TOTAL_ROUNDS) {
                setComplete(true);
              } else {
                setRound(previous => previous + 1);
                generateProblem();
              }
            }, 950);
          };

          const restartGame = () => {
            clearTimeout(timerRef.current);
            setRound(1);
            setComplete(false);
            generateProblem();
          };

          const itemArray = Array.from({ length: targetCount }, (_, index) => index);
          const columns = Math.min(targetCount, 5);
          const rows = Math.ceil(targetCount / columns);

          return (
            <div className="count-shell">
              <div className="count-header">
                <a href="index.html" className="gp-home-inline" aria-label="ホームにもどる"></a>
                <h1 className="count-title">いくつ あるかな？</h1>
                <div className="round-pill">{round} / {TOTAL_ROUNDS} もん</div>
              </div>

              <main className="count-card">
                <section className="items-area" aria-label={`${ITEM_NAMES[currentItem]}が いくつ あるか かぞえる`}>
                  <div className="items-grid" style={{
                    gridTemplateColumns: `repeat(${columns}, minmax(50px, 92px))`,
                    gridTemplateRows: `repeat(${rows}, minmax(50px, 92px))`
                  }}>
                  {itemArray.map(index => {
                    const countNumber = countedOrder.indexOf(index) + 1;
                    return (
                    <button key={`${round}-${index}`} type="button"
                      className={`count-item ${countNumber ? 'counted' : ''}`}
                      style={{ animationDelay: `${index * 0.045}s` }}
                      aria-label={`${ITEM_NAMES[currentItem]} ${index + 1}こめ`}
                      onClick={() => countItem(index)}>
                      <span className="item-picture" style={iconStyle(currentItem)}></span>
                      {countNumber > 0 && <span className="count-badge">{countNumber}</span>}
                    </button>
                    );
                  })}
                  </div>
                </section>

                <section className="answer-area">
                  <p className="guide-text">
                    えを タッチして かぞえたら<br />こたえの すうじを おしてね
                  </p>

                  <div className="number-options" aria-label="こたえの せんたくし">
                    {options.map(value => (
                      <button key={value} type="button"
                        className={`number-btn ${result === 'correct' && value === targetCount ? 'correct' : ''} ${wrongOption === value ? 'wrong' : ''}`}
                        disabled={result === 'correct'}
                        aria-label={`${value}こ`}
                        onClick={() => chooseAnswer(value)}>
                        {value}
                      </button>
                    ))}
                  </div>

                  <div className="count-actions" aria-live="polite">
                    {countedOrder.length > 0 && !result && !feedback && (
                      <button type="button" className="reset-count-btn" onClick={() => setCountedOrder([])}>
                        かぞえなおす
                      </button>
                    )}
                    {feedback && <div className={`feedback-text ${result === 'correct' ? 'correct' : ''}`}>{feedback}</div>}
                  </div>
                </section>
              </main>

              {complete && (
                <div className="complete-screen">
                  <div className="complete-box">
                    <div className="complete-picture" aria-hidden="true"></div>
                    <h2 className="gp-title" style={{ color: '#1d4ed8' }}>5もん できたね！</h2>
                    <p className="guide-text">じょうずに かぞえられました</p>
                    <div className="complete-actions">
                      <button type="button" className="gp-btn gp-btn--lg" onClick={restartGame}>もういっかい</button>
                      <a href="index.html" className="gp-btn gp-btn--lg" style={{ textDecoration: 'none' }}>ゲームのおへや</a>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
