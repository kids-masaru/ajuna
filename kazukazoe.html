<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>いくつあるかな</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            touch-action: manipulation;
            overscroll-behavior: none;
            background-color: #fff;
        }

        .count-picture {
            display: block;
            width: clamp(48px, 12vw, 82px);
            aspect-ratio: 1;
            background-image: url('kazukazoe_items_atlas.png');
            background-size: 400% 400%;
            background-repeat: no-repeat;
            background-color: #fff;
            border-radius: 16px;
            filter: drop-shadow(0 3px 3px rgba(30, 64, 175, .12));
        }

        .trace-pad {
            width: clamp(70px, 18vh, 112px);
            aspect-ratio: 4 / 5;
        }

        .answer-actions button { min-height: 42px; }

        @media (orientation: landscape) and (max-height: 500px) {
            .game-shell { padding: 6px 12px !important; }
            .game-header { margin-bottom: 4px !important; }
            .game-card { display: grid !important; grid-template-columns: minmax(0, 1.25fr) minmax(280px, .75fr); grid-template-rows: auto 1fr; gap: 5px 12px !important; padding: 7px 12px !important; }
            .picture-area { grid-row: 1 / 3; }
            .answer-side { min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
            .trace-row { gap: 14px !important; }
            .answer-actions { gap: 4px !important; }
            .answer-actions button { padding-top: 6px !important; padding-bottom: 6px !important; min-height: 36px; }
            .count-picture { width: clamp(42px, 12vh, 64px); }
        }
    </style>
    <link rel="stylesheet" href="assets/kit.css">
</head>

<body class="gp gp-blue">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 専用4×4アトラス。各セルを正確に切り出し、絵の端まで欠けずに表示する。
        const ITEMS = [
          'りんご','いちご','みかん','にんじん',
          'いぬ','ねこ','うさぎ','パンダ',
          'くるま','あひる','くま','ボール',
          'ひまわり','カップケーキ','アイス','きしゃ'
        ].map((name, slot) => ({ name, slot }));

        const CountPicture = ({ item }) => {
          const col = item.slot % 4;
          const row = Math.floor(item.slot / 4);
          // 4列・4行のセル中心を0%・33.3%・66.7%・100%へ対応させる。
          const safePosition = (index) => index / 3 * 100;
          return <span className="count-picture" role="img" aria-label={item.name}
            style={{ backgroundPosition: `${safePosition(col)}% ${safePosition(row)}%` }} />;
        };

        const playSound = (type) => {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          const ctx = new AC();
          if (type === 'correct') {
            const o1=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain();
            o1.type='sine'; o2.type='sine';
            o1.frequency.setValueAtTime(659.25, ctx.currentTime);
            o2.frequency.setValueAtTime(880.00, ctx.currentTime+0.15);
            g.gain.setValueAtTime(0,ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.05);
            g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.5);
            o1.connect(g); o2.connect(g); g.connect(ctx.destination);
            o1.start(ctx.currentTime); o1.stop(ctx.currentTime+0.15);
            o2.start(ctx.currentTime+0.15); o2.stop(ctx.currentTime+0.5);
          } else {
            const o=ctx.createOscillator(), g=ctx.createGain();
            o.type='sawtooth'; o.frequency.setValueAtTime(150,ctx.currentTime);
            g.gain.setValueAtTime(0,ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.3,ctx.currentTime+0.05);
            g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.4);
            o.connect(g); g.connect(ctx.destination);
            o.start(); o.stop(ctx.currentTime+0.4);
          }
        };

        // なぞり書きキャンバス
        const TracingCanvas = ({ number, onDraw, clearTrigger }) => {
          const canvasRef = useRef(null);
          const isDrawingRef = useRef(false);

          useEffect(() => {
            const canvas = canvasRef.current;
            canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          }, [clearTrigger]);

          // CSS表示サイズとcanvasピクセルサイズのずれを補正
          const getCoords = (e, canvas) => {
            const rect = canvas.getBoundingClientRect();
            const sx = canvas.width / rect.width;
            const sy = canvas.height / rect.height;
            const src = e.touches ? e.touches[0] : e;
            return { x: (src.clientX - rect.left) * sx, y: (src.clientY - rect.top) * sy };
          };

          const onStart = (e) => {
            e.preventDefault();
            isDrawingRef.current = true;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const { x, y } = getCoords(e, canvas);
            ctx.beginPath(); ctx.moveTo(x, y);
            ctx.lineWidth = 14; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.strokeStyle = '#FF6B6B';
            onDraw();
          };
          const onMove = (e) => {
            e.preventDefault();
            if (!isDrawingRef.current) return;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            const { x, y } = getCoords(e, canvas);
            ctx.lineTo(x, y); ctx.stroke();
            onDraw();
          };
          const onEnd = (e) => { e.preventDefault(); isDrawingRef.current = false; };

          return (
            <div className="trace-pad relative border-4 border-dashed border-gray-300 rounded-2xl bg-white shadow-sm overflow-hidden touch-none">
              <div className="absolute inset-0 flex items-center justify-center text-gray-200 select-none pointer-events-none"
                style={{ fontSize: '5.5rem', fontWeight: 'bold', lineHeight: 1 }}>
                {number}
              </div>
              <canvas ref={canvasRef} width={160} height={200}
                className="absolute inset-0 w-full h-full z-10 cursor-crosshair"
                onMouseDown={onStart} onMouseMove={onMove} onMouseUp={onEnd} onMouseLeave={onEnd}
                onTouchStart={onStart} onTouchMove={onMove} onTouchEnd={onEnd}
              />
            </div>
          );
        };

        function App() {
          const [targetCount, setTargetCount] = useState(0);
          const [currentItem, setCurrentItem] = useState(ITEMS[0]);
          const [options, setOptions] = useState([0, 0]);
          const [drawCounts, setDrawCounts] = useState([0, 0]);
          const [clearTrigger, setClearTrigger] = useState(0);
          const [result, setResult] = useState(null); // null | 'correct' | 'incorrect'

          const generateProblem = () => {
            const count = Math.floor(Math.random() * 10) + 1;
            const item = ITEMS[Math.floor(Math.random() * ITEMS.length)];
            let wrong = Math.floor(Math.random() * 10) + 1;
            while (wrong === count) wrong = Math.floor(Math.random() * 10) + 1;
            const opts = Math.random() > 0.5 ? [count, wrong] : [wrong, count];
            setTargetCount(count);
            setCurrentItem(item);
            setOptions(opts);
            setDrawCounts([0, 0]);
            setClearTrigger(p => p + 1);
            setResult(null);
          };

          useEffect(() => { generateProblem(); }, []);

          const handleDraw = (idx) => {
            if (result !== null) return;
            setDrawCounts(prev => { const n=[...prev]; n[idx]+=1; return n; });
          };

          const checkAnswer = () => {
            if (drawCounts[0] === 0 && drawCounts[1] === 0) {
              alert("どちらかの すうじを なぞってね！");
              return;
            }
            const minCount = Math.min(drawCounts[0], drawCounts[1]);
            // 両方に書いた場合は不正解
            if (minCount >= 8) {
              setResult('incorrect');
              playSound('incorrect');
              return;
            }
            const selected = options[drawCounts[0] > drawCounts[1] ? 0 : 1];
            if (selected === targetCount) {
              setResult('correct');
              playSound('correct');
            } else {
              setResult('incorrect');
              playSound('incorrect');
            }
          };

          const resetDrawing = () => {
            setDrawCounts([0, 0]);
            setClearTrigger(p => p + 1);
          };

          const itemArray = Array.from({ length: targetCount }, (_, i) => i);

          return (
            <div className="game-shell h-[100dvh] overflow-hidden flex flex-col bg-white px-3 py-3 touch-manipulation">

              {/* ヘッダー：ホームボタン＋タイトル */}
              <div className="game-header flex items-center gap-2 mb-2 flex-shrink-0">
                <a href="index.html" className="gp-home-inline" aria-label="ホームにもどる"></a>
                <h1 className="text-xl font-bold text-blue-600">いくつ あるかな？</h1>
              </div>

              {/* メインカード */}
              <div className="game-card flex-1 min-h-0 bg-white border-2 border-blue-100 rounded-3xl shadow-xl flex flex-col px-4 pt-3 pb-3 gap-2">

                {/* 絵のエリア */}
                <div className="picture-area flex-1 min-h-0 flex flex-wrap justify-center items-center content-center gap-1 bg-white rounded-2xl p-2 overflow-hidden">
                  {itemArray.map(i => (
                    <span key={i} className="animate-bounce" style={{ animationDelay: `${i * 0.1}s` }}>
                      <CountPicture item={currentItem} />
                    </span>
                  ))}
                </div>

                <div className="answer-side">
                  {/* 説明テキスト */}
                  <p className="text-sm font-bold text-gray-600 text-center flex-shrink-0">
                    せいかいの すうじを なぞってね！
                  </p>

                  {/* なぞり書きエリア */}
                  <div className="trace-row flex justify-center gap-6 flex-shrink-0">
                    <TracingCanvas number={options[0]} onDraw={() => handleDraw(0)} clearTrigger={clearTrigger} />
                    <TracingCanvas number={options[1]} onDraw={() => handleDraw(1)} clearTrigger={clearTrigger} />
                  </div>

                  {/* ボタンエリア */}
                  <div className="answer-actions flex flex-col gap-2 flex-shrink-0">
                  {!result && (
                    <button onClick={resetDrawing}
                      className="w-full py-2 bg-gray-100 text-gray-600 text-sm font-bold rounded-xl active:bg-gray-300 active:scale-95 transition-all">
                      なぞりなおす
                    </button>
                  )}

                  {!result ? (
                    <button onClick={checkAnswer}
                      className="w-full py-3 bg-green-500 text-white text-xl font-bold rounded-2xl shadow-md active:scale-95 transition-all">
                      こたえあわせ！
                    </button>
                  ) : (
                    <div className="flex flex-col items-center gap-2">
                      <div className={`flex items-center justify-center gap-2 text-2xl font-bold ${result === 'correct' ? 'text-red-500' : 'text-blue-500'}`}>
                        {result === 'correct' && <img src="ui_sparkle_128.png" alt="" className="w-9 h-9 object-contain" />}
                        <span>{result === 'correct' ? 'せいかい！' : 'ちがうよ'}</span>
                      </div>
                      {result === 'correct' ? (
                        <button onClick={generateProblem}
                          className="w-full py-3 bg-yellow-400 text-yellow-900 text-xl font-bold rounded-2xl shadow-md active:scale-95 transition-all">
                          つぎの もんだい！
                        </button>
                      ) : (
                        <button onClick={() => { setResult(null); resetDrawing(); }}
                          className="w-full py-3 bg-blue-400 text-white text-xl font-bold rounded-2xl shadow-md active:scale-95 transition-all">
                          もういっかい！
                        </button>
                      )}
                    </div>
                  )}
                  </div>
                </div>

              </div>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
