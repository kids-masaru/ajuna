<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おかいものごっこ</title>
    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            touch-action: manipulation;
            overscroll-behavior: none;
            background-color: #0f172a;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }

        .animate-sway {
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes sway {

            0%,
            100% {
                transform: rotate(-2deg);
            }

            50% {
                transform: rotate(2deg);
            }
        }

        #orientation-stage {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }

        @media (orientation: portrait) {
            #orientation-stage { visibility: hidden; }
            body.forced-landscape #rotate-overlay { display: none; }
            body.forced-landscape #orientation-stage {
                visibility: visible;
                width: 100vh;
                height: 100vw;
                transform: rotate(90deg);
                transform-origin: top left;
                top: 0;
                left: 100%;
            }
        }

        .shop-scene {
            background-image: linear-gradient(rgba(255,255,255,.16), rgba(255,255,255,.12)), url('kaimono_shop_scenes_v2.png');
            background-size: 400% 200%;
            background-repeat: no-repeat;
            background-color: #fff7ed;
        }

        .shop-thumb {
            background-image: url('kaimono_shop_scenes_v2.png');
            background-size: 400% 200%;
            background-repeat: no-repeat;
        }

        .checkout-scene {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f8ddad url('kaimono_checkout_scene_v3.png') center / 100% 100% no-repeat;
        }

        .checkout-customer {
            position: absolute;
            left: 3%;
            bottom: 1%;
            z-index: 12;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            pointer-events: none;
            filter: drop-shadow(0 8px 10px rgba(74, 40, 16, .25));
        }

        .checkout-customer > img {
            width: clamp(82px, 17vh, 132px);
            height: clamp(82px, 17vh, 132px);
            object-fit: contain;
        }

        .checkout-customer .picture-basket {
            width: clamp(120px, 19vw, 190px);
        }

        .checkout-target {
            position: absolute;
            left: 46%;
            top: 76%;
            z-index: 10;
            width: clamp(92px, 14vw, 150px);
            aspect-ratio: 1.7;
            transform: translate(-50%, -50%);
            border: 5px dashed rgba(255, 239, 126, .95);
            border-radius: 999px;
            background: rgba(255,255,255,.18);
            box-shadow: 0 0 0 8px rgba(255,255,255,.45), 0 0 28px rgba(255,220,84,.9);
            animation: checkout-target-pulse 1s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes checkout-target-pulse {
            to { transform: translate(-50%, -50%) scale(1.1); filter: brightness(1.16); }
        }

        .checkout-payment {
            position: absolute;
            left: 23%;
            top: 70%;
            z-index: 25;
            width: clamp(72px, 11vw, 116px);
            aspect-ratio: 1;
            padding: 0;
            border: 0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: transparent;
            filter: drop-shadow(0 10px 8px rgba(91, 53, 8, .3));
            touch-action: none;
            cursor: grab;
            transition: left .62s cubic-bezier(.2,.9,.3,1), top .62s cubic-bezier(.2,.9,.3,1), transform .62s ease, opacity .62s ease;
        }

        .checkout-payment.dragging { transition: none; cursor: grabbing; }
        .checkout-payment.sending { left: 46%; top: 76%; transform: translate(-50%, -50%) scale(.42) rotate(360deg); opacity: .2; }
        .checkout-payment.paid { opacity: 0; pointer-events: none; }

        .checkout-coin {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            border: clamp(5px, .7vw, 9px) solid #fff4a4;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 28%, #fff7a0 0 9%, #ffd748 31%, #efa91d 72%, #c97910 100%);
            box-shadow: inset 0 0 0 7px rgba(255,255,255,.35), 0 0 0 7px rgba(255,213,64,.35);
        }

        .checkout-coin img { width: 58%; height: 58%; object-fit: contain; }

        .checkout-success {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: grid;
            place-items: center;
            background: rgba(255,255,255,.38);
            backdrop-filter: blur(3px);
            animation: checkout-success-in .3s ease-out;
        }

        .checkout-success__card {
            display: grid;
            place-items: center;
            gap: 5px;
            min-width: min(52vw, 430px);
            padding: 16px 32px;
            border: 7px solid #fff;
            border-radius: 36px;
            color: #18794e;
            background: rgba(241,255,245,.96);
            box-shadow: 0 14px 34px rgba(34,84,55,.24);
        }

        .checkout-success__mark {
            display: grid;
            place-items: center;
            width: clamp(70px, 15vh, 112px);
            aspect-ratio: 1;
            border-radius: 50%;
            color: white;
            background: #24bd68;
            box-shadow: 0 0 0 10px rgba(106,223,150,.28);
        }

        .checkout-success__card h2 { margin: 0; font-size: clamp(1.5rem, 7vh, 3rem); }
        @keyframes checkout-success-in { from { opacity: 0; transform: scale(.7); } }

        .picture-basket {
            position: relative;
            width: clamp(150px, 25vw, 230px);
            aspect-ratio: 1.5;
            background: url('ui_shopping_basket_v2.png') center / contain no-repeat;
            filter: drop-shadow(0 8px 8px rgba(91, 33, 20, .25));
        }

        .picture-basket__items {
            position: absolute;
            left: 18%;
            right: 18%;
            top: 13%;
            height: 48%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: wrap;
            gap: 1px;
            overflow: hidden;
        }

        .shelf-stage {
            background: rgba(255, 250, 242, .68);
            border: 3px solid rgba(255,255,255,.8);
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(71, 35, 12, .2);
            backdrop-filter: blur(3px);
        }

        .atlas-icon {
            display: block;
            flex: none;
            height: var(--atlas-height, 54px);
            aspect-ratio: var(--atlas-ratio);
            background-repeat: no-repeat;
            background-color: #fff;
            border-radius: 16px;
        }

        .atlas-icon--shop {
            --atlas-height: 86px;
        }

        .atlas-icon--list {
            --atlas-height: 38px;
            border-radius: 10px;
        }

        .atlas-icon--drag {
            --atlas-height: 72px;
            border-radius: 18px;
        }

        .atlas-icon--cart {
            --atlas-height: 34px;
            border-radius: 10px;
        }

        @media (min-width: 768px) {
            .atlas-icon { --atlas-height: 72px; }
            .atlas-icon--shop { --atlas-height: 116px; }
            .atlas-icon--list { --atlas-height: 48px; }
            .atlas-icon--drag { --atlas-height: 96px; }
            .atlas-icon--cart { --atlas-height: 54px; }
        }

        /* 横向きスマホでは幅が広くても高さが短いため、商品を詰め込みすぎない。 */
        @media (max-height: 500px) {
            .atlas-icon { --atlas-height: 46px; }
            .atlas-icon--shop { --atlas-height: 86px; }
            .atlas-icon--list { --atlas-height: 36px; }
            .atlas-icon--drag { --atlas-height: 72px; }
            .atlas-icon--cart { --atlas-height: 32px; }
        }

    </style>
    <script>
        async function forceShoppingLandscape() {
            // 回転固定に対応しない端末でも、CSS回転で必ず横レイアウトを表示する。
            document.body.classList.add('forced-landscape');
            try {
                const el = document.documentElement;
                if (el.requestFullscreen && !document.fullscreenElement) {
                    await el.requestFullscreen();
                }
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch (error) {
                console.warn('端末の向きを固定できないため、横向き表示へ切り替えました。', error);
            }
        }

        window.onerror = function (message, source, lineno, colno, error) {
            const root = document.getElementById('root');
            if (root) {
                // エラー文をHTMLとして解釈せず、外部スクリプト由来の文字列も安全に表示する
                const panel = document.createElement('div');
                const title = document.createElement('h2');
                const detail = document.createElement('p');
                panel.style.cssText = 'color:#f87171;background:#450a0a;padding:20px;';
                title.textContent = 'エラー';
                detail.textContent = String(message);
                panel.append(title, detail);
                root.replaceChildren(panel);
            }
        };
    </script>
    <link rel="stylesheet" href="assets/kit.css">
    <link rel="stylesheet" href="assets/landscape-prompt.css">
</head>

<body class="gp gp-emerald gp-dark fixed inset-0 overflow-hidden">
    <div id="rotate-overlay" class="landscape-prompt" role="dialog" aria-modal="true" aria-label="横画面で遊ぶ案内">

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{children}</svg>
        );
        const Play = (props) => (<IconBase {...props}><polygon points="5 3 19 12 5 21 5 3" /></IconBase>);
        const Volume2 = (props) => (<IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /></IconBase>);
        const VolumeX = (props) => (<IconBase {...props}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" x2="17" y1="9" y2="15" /><line x1="17" x2="23" y1="9" y2="15" /></IconBase>);
        const ArrowLeft = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className={props.className}>
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        );
        const Check = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={props.size || 24} height={props.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" className={props.className} aria-hidden="true">
                <path d="M5 12.5l4.2 4.2L19 7" />
            </svg>
        );

        // 店舗ごとの商品アトラスから、指定した1マスだけを切り出して表示する。
        const AtlasIcon = ({ shop, item, variant = "" }) => {
            const col = item.slot % shop.cols;
            const row = Math.floor(item.slot / shop.cols);
            const posX = shop.cols > 1 ? (col / (shop.cols - 1)) * 100 : 0;
            const posY = shop.rows > 1 ? (row / (shop.rows - 1)) * 100 : 0;
            const cellRatio = (1.5 * shop.rows) / shop.cols;
            return (
                <span
                    className={`atlas-icon ${variant ? `atlas-icon--${variant}` : ''}`}
                    aria-hidden="true"
                    style={{
                        '--atlas-ratio': cellRatio,
                        backgroundImage: `url('${shop.atlas}')`,
                        backgroundSize: `${shop.cols * 100}% ${shop.rows * 100}%`,
                        backgroundPosition: `${posX}% ${posY}%`
                    }}
                />
            );
        };

        // --- Clipboard Style Shopping List ---
        const ClipboardList = ({ shop, items, foundItems, onSpeak }) => (
            <div className="relative bg-[#fdf6e3] rounded-sm shadow-lg border-2 border-[#d3c6aa] p-2 flex flex-col gap-2 min-h-[140px] w-20 md:w-24">
                {/* Clipboard Top Clip */}
                <div className="absolute -top-3 left-1/2 -translate-x-1/2 w-8 h-4 bg-gray-400 rounded-t-md border-b-2 border-gray-500 flex items-center justify-center z-10">
                    <div className="w-4 h-1 bg-gray-300 rounded-full"></div>
                </div>
                <div className="text-[10px] font-bold text-gray-500 text-center border-b border-gray-300 pb-1 mb-1 mt-1">LIST</div>
                <div className="flex flex-col gap-3">
                    {items.map(item => {
                        const done = foundItems.some(f => f.id === item.id);
                        return (
                            <button
                                type="button"
                                key={item.id}
                                onClick={() => onSpeak(item.name)}
                                aria-label={`${item.name}をきく`}
                                className={`relative flex flex-col items-center justify-center transition-all bg-transparent border-0 p-0 ${done ? 'opacity-30' : 'scale-110'}`}
                            >
                                <div className="relative">
                                    <AtlasIcon shop={shop} item={item} variant="list" />
                                    {done && (
                                        <div className="absolute inset-0 flex items-center justify-center">
                                            <Check size={38} className="text-green-600 drop-shadow-md" />
                                        </div>
                                    )}
                                </div>
                            </button>
                        );
                    })}
                </div>
            </div>
        );

        // 商品を重ねても中身が見える、専用イラストの買い物かご。
        const PictureBasket = ({ children }) => (
            <div className="picture-basket" aria-hidden="true">
                <div className="picture-basket__items">{children}</div>
            </div>
        );

        // --- Wooden Shelf Component ---
        const ShelfLayer = ({ children }) => (
            <div className="relative w-full h-16 flex flex-col items-center justify-end group">
                {/* The Wooden Board */}
                <div className="absolute inset-x-0 bottom-0 h-4 bg-[#8b4513] rounded shadow-lg z-0 overflow-hidden">
                    {/* Wood Texture Lines */}
                    <div className="absolute top-1 left-0 right-0 h-[1px] bg-white/10"></div>
                    <div className="absolute top-2 left-0 right-0 h-[1px] bg-black/20"></div>
                </div>
                {/* Depth Lip */}
                <div className="absolute inset-x-2 bottom-4 h-1 bg-[#654321] rounded-full z-0"></div>
                {/* Items Container */}
                <div className="relative z-10 flex items-end justify-center w-full h-full pb-2 px-2">
                    {children}
                </div>
            </div>
        );

        const makeItems = (prefix, names) => names.map((name, slot) => ({ id: `${prefix}${slot + 1}`, name, slot }));

        // 商品名と画像上の順番を揃え、絵文字に依存しないデータに統一する。
        const SHOPS = [
            { id: 'greengrocer', name: 'やおやさん', sceneSlot: 0, atlas: 'kaimono_items_greengrocer_atlas.png', cols: 6, rows: 3, bg: 'bg-[#f7fee7]', border: 'border-[#bef264]', items: makeItems('v', ['にんじん', 'じゃがいも', 'コーン', 'トマト', 'なす', 'きゅうり', 'たまねぎ', 'ブロッコリー', 'かぼちゃ', 'さつまいも', 'ぶどう', 'メロン', 'すいか', 'いちご', 'もも', 'りんご', 'キノコ', 'さくらんぼ']) },
            { id: 'fish', name: 'おさかなや', sceneSlot: 1, atlas: 'kaimono_items_fish_atlas.png', cols: 5, rows: 3, bg: 'bg-[#f0f9ff]', border: 'border-[#7dd3fc]', items: makeItems('f', ['さかな', 'たこ', 'いか', 'えび', 'かに', 'ふぐ', 'かい', 'さめ', 'くじら', 'いるか', 'ねったいぎょ', 'ロブスター', 'ペンギン', 'かめ']) },
            { id: 'sweets', name: 'おかしや', sceneSlot: 2, atlas: 'kaimono_items_sweets_atlas.png', cols: 5, rows: 3, bg: 'bg-[#fff1f2]', border: 'border-[#fba1b7]', items: makeItems('s', ['あめ', 'クッキー', 'チョコ', 'ドーナツ', 'ケーキ', 'プリン', 'アイス', 'だんご', 'ペロペロキャンディ', 'かきごおり', 'はちみつ', 'ポップコーン', 'バースデーケーキ', 'クロワッサン']) },
            { id: 'bakery', name: 'パンやさん', sceneSlot: 3, atlas: 'kaimono_items_bakery_atlas.png', cols: 5, rows: 2, bg: 'bg-[#fff7ed]', border: 'border-[#fdba74]', items: makeItems('b', ['しょくパン', 'クロワッサン', 'フランスパン', 'ベーグル', 'パンケーキ', 'ワッフル', 'サンドイッチ', 'ホットドッグ', 'ピザ', 'プレッツェル']) },
            { id: 'toys', name: 'おもちゃや', sceneSlot: 4, atlas: 'kaimono_items_toys_atlas.png', cols: 4, rows: 3, bg: 'bg-[#fefce8]', border: 'border-[#fde047]', items: makeItems('t', ['くまさん', 'ロボット', 'くるま', 'きしゃ', 'ボール', 'ゲーム', 'パズル', 'たいこ', 'きょうりゅう', 'UFO', 'しょうぼうしゃ', 'パトカー']) },
            { id: 'flowers', name: 'おはなや', sceneSlot: 5, atlas: 'kaimono_items_flowers_atlas.png', cols: 4, rows: 3, bg: 'bg-[#fff1f2]', border: 'border-[#fda4af]', items: makeItems('fl', ['はなたば', 'バラ', 'ひまわり', 'チューリップ', 'ハイビスカス', 'サクラ', 'マーガレット', 'サボテン', 'ツリー', 'クローバー', 'もみじ', 'おちば']) },
            { id: 'convenience', name: 'コンビニ', sceneSlot: 6, atlas: 'kaimono_items_convenience_atlas.png', cols: 4, rows: 3, bg: 'bg-[#f8fafc]', border: 'border-[#cbd5e1]', items: makeItems('c', ['おにぎり', 'ハンバーガー', 'ポテト', 'ぎゅうにゅう', 'おべんとう', 'おちゃ', 'バナナ', 'ジュース', 'たまご', 'コーヒー', 'かさ', 'しんぶん']) }
        ];

        const scenePosition = (slot) => `${(slot % 4) / 3 * 100}% ${Math.floor(slot / 4) * 100}%`;

        const speak = (text) => {
            if (!window.speechSynthesis) return;
            try {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = 'ja-JP';
                msg.rate = 1.1;
                msg.pitch = 1.4;
                window.speechSynthesis.speak(msg);
            } catch (error) {
                // 読み上げが使えない端末でも、絵を見てそのまま買い物を続けられる。
                console.warn('買い物ゲームの読み上げを開始できませんでした。', error);
            }
        };

        const DragItem = ({ shop, item, x, y }) => (
            <div className="fixed z-[999] pointer-events-none flex flex-col items-center justify-center p-2 bg-white/90 rounded-full shadow-2xl border-4 border-orange-400 w-24 h-24 md:w-32 md:h-32 animate-pulse" style={{ left: x, top: y, transform: 'translate(-50%, -50%)' }}>
                <AtlasIcon shop={shop} item={item} variant="drag" />
            </div>
        );

        function App() {
            // タイトル画面を出さずに、いきなりお店えらびから始める
            const [gameState, setGameState] = useState('select_shop');
            const [currentShop, setCurrentShop] = useState(SHOPS[0]);

            const [targetItems, setTargetItems] = useState([]);
            const [shelfItems, setShelfItems] = useState([]);
            const [foundItems, setFoundItems] = useState([]);

            const [dragState, setDragState] = useState(null);
            const basketRef = useRef(null);
            const dragTimerRef = useRef(null);
            const dragActiveRef = useRef(false);
            const [paymentPhase, setPaymentPhase] = useState('ready');
            const [paymentDrag, setPaymentDrag] = useState(null);
            const checkoutSceneRef = useRef(null);
            const checkoutTargetRef = useRef(null);
            const paymentPointerRef = useRef(null);
            const paymentLockedRef = useRef(false);
            const checkoutTimersRef = useRef([]);

            const [isMuted, setIsMuted] = useState(false);
            const audioCtx = useRef(null);
            const bgmRef = useRef(null);

            const initAudio = () => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!audioCtx.current && AudioContext) {
                        audioCtx.current = new AudioContext();
                    }
                    if (audioCtx.current && audioCtx.current.state === 'suspended') {
                        audioCtx.current.resume().catch(error => {
                            console.warn('買い物ゲームの音声を再開できませんでした。', error);
                        });
                    }
                } catch (error) {
                    // 音声が使えない端末でも、買い物操作はそのまま続けられる
                    audioCtx.current = null;
                    console.warn('買い物ゲームの音声を準備できませんでした。', error);
                }
            };

            const playSound = (freq, type) => { /* simplified for brevity */
                if (!audioCtx.current || isMuted) return;
                try {
                    const osc = audioCtx.current.createOscillator();
                    const gain = audioCtx.current.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, audioCtx.current.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.current.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.current.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.current.destination);
                    osc.start();
                    osc.stop(audioCtx.current.currentTime + 0.2);
                } catch (error) {
                    console.warn('買い物ゲームの効果音を再生できませんでした。', error);
                }
            };

            // 音はブラウザの決まりに合わせ、最初のタッチ後にだけ準備する。
            // 横画面切替は画面上の専用ボタンが担当する。
            useEffect(() => {
                speak("どこのおみせにいく？");
                const unlock = () => {
                    initAudio();
                };
                document.addEventListener('pointerdown', unlock, { once: true });
                return () => document.removeEventListener('pointerdown', unlock);
            }, []);

            const startBGM = () => {
                if (!bgmRef.current || isMuted) return;
                bgmRef.current.volume = 0.3;
                bgmRef.current.play().catch(error => {
                    console.warn('買い物ゲームのBGMを開始できませんでした。', error);
                });
            };
            const stopBGM = () => { if (bgmRef.current) { bgmRef.current.pause(); bgmRef.current.currentTime = 0; } };

            useEffect(() => {
                if (bgmRef.current) bgmRef.current.muted = isMuted;
                if ((gameState === 'playing' || gameState === 'checkout') && !isMuted) startBGM();
                else if (isMuted) { }
            }, [isMuted, gameState]);

            useEffect(() => { if (gameState === 'playing' || gameState === 'checkout') startBGM(); else stopBGM(); }, [gameState]);

            useEffect(() => {
                document.body.classList.toggle('shopping-active', gameState === 'playing' || gameState === 'checkout');
                return () => document.body.classList.remove('shopping-active');
            }, [gameState]);

            useEffect(() => () => {
                checkoutTimersRef.current.forEach(timer => clearTimeout(timer));
            }, []);

            // Robust Drag & Drop using Window Listeners
            useEffect(() => {
                if (!dragState) return;

                const handleMove = (e) => {
                    setDragState(prev => ({ ...prev, x: e.clientX, y: e.clientY }));
                };

                const handleUp = (e) => {
                    if (dragTimerRef.current) clearTimeout(dragTimerRef.current);
                    if (basketRef.current) {
                        const rect = basketRef.current.getBoundingClientRect();
                        if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                            handleDropInBasket(dragState.item);
                        }
                    }
                    dragActiveRef.current = false;
                    setDragState(null);
                };

                window.addEventListener('pointermove', handleMove);
                window.addEventListener('pointerup', handleUp);
                return () => {
                    window.removeEventListener('pointermove', handleMove);
                    window.removeEventListener('pointerup', handleUp);
                };
            }, [dragState]);

            const startShopping = (shop) => {
                initAudio();
                checkoutTimersRef.current.forEach(timer => clearTimeout(timer));
                checkoutTimersRef.current = [];
                paymentLockedRef.current = false;
                paymentPointerRef.current = null;
                setPaymentPhase('ready');
                setPaymentDrag(null);
                const pool = [...shop.items, ...shop.items, ...shop.items].sort(() => 0.5 - Math.random());
                const shelfContent = pool.slice(0, 20).map((item, idx) => ({ ...item, uniqueId: `${item.id}-${idx}` }));
                const uniqueItemsOnShelf = [...new Set(shelfContent.map(i => i.id))].map(id => shop.items.find(i => i.id === id));
                const shuffledUnique = uniqueItemsOnShelf.sort(() => 0.5 - Math.random());
                const targetCount = 3 + Math.floor(Math.random() * 2); // 3-4 items max for easier list
                const targets = shuffledUnique.slice(0, targetCount);

                setCurrentShop(shop);
                setShelfItems(shelfContent);
                setTargetItems(targets);
                setFoundItems([]);
                setGameState('playing');
                speak(`${shop.name}！`);
                playSound(880, 'sine');
            };

            const handleDropInBasket = (item) => {
                if (foundItems.some(f => f.id === item.id)) { speak("それはもうかったよ！"); return; }
                const isCorrect = targetItems.some(t => t.id === item.id);
                if (isCorrect) {
                    const newFound = [...foundItems, item];
                    setFoundItems(newFound);
                    playSound(1046, 'sine');
                    speak(`${item.name}、オッケー！`);
                    if (newFound.length === targetItems.length) {
                        paymentLockedRef.current = false;
                        setPaymentPhase('ready');
                        setPaymentDrag(null);
                        setGameState('checkout');
                        speak("やったー！ レジで おかねを わたしてね！");
                    }
                } else {
                    playSound(200, 'triangle');
                    speak("ちがうよ〜");
                }
            };

            // 短いタップと長押しドラッグを分け、最初のタップが消えないようにする。
            const handlePointerDown = (e, item) => {
                if (e.button && e.button !== 0) return;
                if (dragTimerRef.current) clearTimeout(dragTimerRef.current);
                dragActiveRef.current = false;
                const start = { item, x: e.clientX, y: e.clientY, pointerId: e.pointerId };
                dragTimerRef.current = setTimeout(() => {
                    dragActiveRef.current = true;
                    setDragState(start);
                }, 140);
                playSound(440, 'sine');
            };

            const handlePointerUpOnItem = (item) => {
                if (dragTimerRef.current) clearTimeout(dragTimerRef.current);
                dragTimerRef.current = null;
                if (!dragActiveRef.current) handleDropInBasket(item);
            };

            const cancelDrag = () => {
                if (dragTimerRef.current) clearTimeout(dragTimerRef.current);
                dragTimerRef.current = null;
                dragActiveRef.current = false;
                setDragState(null);
            };

            const finishPayment = () => {
                if (paymentLockedRef.current) return;
                paymentLockedRef.current = true;
                paymentPointerRef.current = null;
                setPaymentDrag(null);
                setPaymentPhase('sending');
                playSound(784, 'sine');
                const paidTimer = setTimeout(() => {
                    setPaymentPhase('paid');
                    playSound(1046, 'sine');
                    speak("オッケー！ ありがとう！ またきてね！");
                }, 620);
                const exitTimer = setTimeout(() => {
                    setGameState('select_shop');
                    setPaymentPhase('ready');
                    paymentLockedRef.current = false;
                }, 2700);
                checkoutTimersRef.current.push(paidTimer, exitTimer);
            };

            const handlePaymentPointerDown = (event) => {
                if (paymentLockedRef.current || !checkoutSceneRef.current) return;
                event.preventDefault();
                const sceneRect = checkoutSceneRef.current.getBoundingClientRect();
                paymentPointerRef.current = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY };
                setPaymentDrag({ x: event.clientX - sceneRect.left, y: event.clientY - sceneRect.top });
                try {
                    event.currentTarget.setPointerCapture(event.pointerId);
                } catch (error) {
                    // 指の固定に失敗しても、タップ会計で必ず進める。
                    console.warn('会計コインの指追跡を固定できませんでした。', error);
                }
            };

            const handlePaymentPointerMove = (event) => {
                const pointer = paymentPointerRef.current;
                if (!pointer || pointer.pointerId !== event.pointerId || !checkoutSceneRef.current) return;
                event.preventDefault();
                const sceneRect = checkoutSceneRef.current.getBoundingClientRect();
                setPaymentDrag({ x: event.clientX - sceneRect.left, y: event.clientY - sceneRect.top });
            };

            const handlePaymentPointerUp = (event) => {
                const pointer = paymentPointerRef.current;
                if (!pointer || pointer.pointerId !== event.pointerId) return;
                event.preventDefault();
                const targetRect = checkoutTargetRef.current && checkoutTargetRef.current.getBoundingClientRect();
                const onTarget = targetRect && event.clientX >= targetRect.left && event.clientX <= targetRect.right && event.clientY >= targetRect.top && event.clientY <= targetRect.bottom;
                const shortTap = Math.hypot(event.clientX - pointer.startX, event.clientY - pointer.startY) < 18;
                paymentPointerRef.current = null;
                if (onTarget || shortTap) finishPayment();
                else {
                    setPaymentDrag(null);
                    speak("レジの ひかるところに わたしてね！");
                }
            };

            return (
                <div
                    className={`relative h-[100dvh] ${currentShop.bg} transition-colors duration-700 flex flex-col overflow-hidden select-none touch-manipulation font-sans`}
                    onPointerCancel={cancelDrag}
                >
                    <audio ref={bgmRef} src="./kaimono_bgm.mp3" loop />
                    {dragState && <DragItem shop={currentShop} item={dragState.item} x={dragState.x} y={dragState.y} />}

                    {/* ALWAYS Visible Home */}
                    <a href="index.html" className="gp-home" title="ホーム" aria-label="ホームにもどる"></a>

                    {/* Scene Specific UI */}
                    {gameState === 'playing' && (
                        <button
                            onClick={() => { setGameState('select_shop'); stopBGM(); }}
                            className="fixed top-4 right-4 z-[110] bg-orange-500 p-3 rounded-full border-4 border-orange-200 w-16 h-16 flex items-center justify-center shadow-lg active:scale-90 transition-all text-white"
                            title="おみせをでる"
                        >
                            <ArrowLeft size={32} />
                        </button>
                    )}

                    {/* Shop Select: Horizontal Scroll / Optimized for Landscape */}
                    {gameState === 'select_shop' && (
                        <div className="w-full h-full bg-orange-50 flex flex-col p-4 items-center justify-center gap-8">
                            <h2 className="shop-select-title text-3xl md:text-4xl font-bold text-orange-600 shrink-0 drop-shadow-sm">どこの おみせに いく？</h2>
                            {/* Horizontal Scroll Container */}
                            <div className="shop-select-list w-full flex items-center overflow-x-auto gap-6 px-8 no-scrollbar snap-x py-4">
                                {SHOPS.map(shop => (
                                    <button key={shop.id} onClick={() => startShopping(shop)} aria-label={`${shop.name}へいく`} className={`shop-select-card shrink-0 w-40 h-40 md:w-56 md:h-56 flex flex-col items-center justify-end overflow-hidden ${shop.bg} rounded-[2rem] border-4 ${shop.border} shadow-lg active:scale-95 scroll-ml-6 snap-center hover:rotate-2 transition-all`}>
                                        <span className="shop-thumb w-full flex-1" style={{ backgroundPosition: scenePosition(shop.sceneSlot) }} aria-hidden="true"></span>
                                        <span className="w-full bg-white/95 py-2 text-xl md:text-2xl font-bold text-gray-700">{shop.name}</span>
                                    </button>
                                ))}
                                <div className="w-4 shrink-0"></div>
                            </div>
                        </div>
                    )}

                    {gameState === 'playing' ? (
                        <div className="shop-scene relative w-full h-full flex flex-col" style={{ backgroundPosition: scenePosition(currentShop.sceneSlot) }}>

                            {/* Clipboard Shopping List (Sidebar) */}
                            <div className="shopping-list-wrap absolute top-24 left-2 z-30 pointer-events-auto">
                                <ClipboardList shop={currentShop} items={targetItems} foundItems={foundItems} onSpeak={speak} />
                            </div>

                            {/* Shelves Layout: Stacking 3 tiers vertically */}
                            <div className="flex-1 min-h-0 overflow-x-auto overflow-y-hidden flex flex-col items-center justify-center p-2 md:p-4 no-scrollbar scroll-smooth">
                                <div className="shelf-stage flex flex-col gap-1 min-w-max px-12 pt-3 pb-2">
                                    {[0, 7, 14].map(startIdx => (
                                        <div key={startIdx} className="w-[600px]">
                                            <ShelfLayer>
                                                {shelfItems.slice(startIdx, startIdx + 7).map(item => {
                                                    const isCollected = foundItems.some(f => f.id === item.id);
                                                    return (
                                                        <div key={item.uniqueId} className="w-16 h-14 flex flex-col items-center justify-end shrink-0 mx-1">
                                                            {!isCollected && (
                                                                <button
                                                                    type="button"
                                                                    className="flex flex-col items-center cursor-grab active:cursor-grabbing transform transition-transform hover:scale-110 bg-transparent border-0 p-0"
                                                                    style={{ touchAction: 'none' }}
                                                                    onPointerDown={(e) => handlePointerDown(e, item)}
                                                                    onPointerUp={() => handlePointerUpOnItem(item)}
                                                                    aria-label={`${item.name}をかごにいれる`}
                                                                >
                                                                    <AtlasIcon shop={currentShop} item={item} />
                                                                </button>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </ShelfLayer>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Basket & Character Side-by-Side: Responsive Scale & Half-Body Clip */}
                            <div ref={basketRef} role="region" aria-label="かご" className="shopping-basket-row relative shrink-0 left-0 right-0 h-24 z-40 flex items-end justify-center pointer-events-none gap-4">
                                <div className="w-full max-w-4xl flex items-end justify-center px-4">
                                    {/* Character */}
                                    <div className="shrink-0 animate-sway">
                                        <img src="osewa_title_girl_512.png" alt="かごをもつ女の子とうさぎ" className="w-24 h-24 object-contain drop-shadow-lg" draggable="false" />
                                    </div>
                                    <PictureBasket>
                                        {foundItems.map((item, idx) => (
                                            <AtlasIcon key={`${item.id}-${idx}`} shop={currentShop} item={item} variant="cart" />
                                        ))}
                                    </PictureBasket>
                                </div>
                            </div>

                        </div>
                    ) : null}

                    {gameState === 'checkout' && (
                        <div ref={checkoutSceneRef} className="checkout-scene">
                            <div ref={checkoutTargetRef} className="checkout-target" aria-hidden="true"></div>
                            <div className="checkout-customer" aria-hidden="true">
                                <img src="osewa_title_girl_512.png" alt="" draggable="false" />
                                <PictureBasket>
                                    {foundItems.map((item, idx) => (
                                        <AtlasIcon key={`${item.id}-checkout-${idx}`} shop={currentShop} item={item} variant="cart" />
                                    ))}
                                </PictureBasket>
                            </div>
                            <button
                                type="button"
                                className={`checkout-payment ${paymentDrag ? 'dragging' : ''} ${paymentPhase}`}
                                style={paymentDrag ? { left: paymentDrag.x, top: paymentDrag.y } : undefined}
                                onPointerDown={handlePaymentPointerDown}
                                onPointerMove={handlePaymentPointerMove}
                                onPointerUp={handlePaymentPointerUp}
                                onPointerCancel={() => { paymentPointerRef.current = null; setPaymentDrag(null); }}
                                aria-label="おかねをレジにわたす"
                            >
                                <span className="checkout-coin"><img src="ui_sparkle_128.png" alt="" draggable="false" /></span>
                            </button>
                            {paymentPhase === 'paid' && (
                                <div className="checkout-success" aria-live="polite">
                                    <div className="checkout-success__card">
                                        <span className="checkout-success__mark"><Check size={72} /></span>
                                        <h2>ありがとう！</h2>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
