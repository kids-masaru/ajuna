<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オーダー回転寿司</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="assets/kit.css">
</head>
<body class="gp gp-red gp-dark">
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ===== スプライトアトラス =====
const ATLAS_SRC = 'sushi_parts.png';
const ATLAS_W = 1400, ATLAS_H = 560;
const FRAMES = {"plate_red":[0,0,221,192],"btn_go":[225,0,169,172],"plate_blue":[398,0,178,155],"plate_yellow":[580,0,172,153],"plate_purple":[756,0,165,152],"plate_green":[925,0,168,151],"plate_pink":[1097,0,160,148],"iwashi":[0,196,209,131],"gunkan":[213,196,127,130],"tako":[344,196,191,130],"hotate":[539,196,189,129],"ika":[732,196,190,128],"amaebi":[926,196,222,126],"shiromi":[1152,196,193,125],"maguro":[0,331,187,124],"salmon":[191,331,196,122],"ebi":[391,331,214,120],"anago":[609,331,199,120],"btn_back":[812,331,119,120],"btn_clear":[935,331,121,119],"shari":[1060,331,163,115],"tamago":[1227,331,151,97],"ikura":[0,459,144,97],"uni":[148,459,135,96],"negitoro":[287,459,135,95],"salmon_g":[426,459,130,91],"nori":[560,459,59,90],"corn":[623,459,132,84],"natto":[759,459,134,83],"wasabi":[897,459,69,76],"kyuri":[970,459,92,70]};
// レーンは繰り返し表示するので別画像（アトラスだと隣の絵まで一緒に流れてしまう）
const LANE_SRC = 'sushi_lane.png';
const LANE_W = 116, LANE_H = 127;

// 高さ h(px) にあわせたスプライト表示スタイル
function spriteStyle(name, h) {
  const f = FRAMES[name];
  if (!f) return {};
  const s = h / f[3];
  return {
    width: f[2] * s + 'px',
    height: h + 'px',
    backgroundImage: `url(${ATLAS_SRC})`,
    backgroundSize: `${ATLAS_W * s}px ${ATLAS_H * s}px`,
    backgroundPosition: `-${f[0] * s}px -${f[1] * s}px`,
    backgroundRepeat: 'no-repeat',
  };
}
function Sprite({ name, h, style, className }) {
  return <div className={className} style={{ ...spriteStyle(name, h), ...(style || {}) }} />;
}
// 元の絵の比率をそのまま保つ共通スケール（部品どうしの大きさが正しくなる）
const SCALE = 0.52;
// 一部の部品だけ大きさを微調整したいときの倍率
const SIZE_ADJ = { nori: 0.85 };
const partH = (name) => FRAMES[name][3] * SCALE * (SIZE_ADJ[name] || 1);

// ===== 部品（元のゲームと同じ9種） =====
// dy: お皿の中心からの縦位置。重ねると本物のお寿司になるように調整してある
// にぎりのネタ（シャリの上にのせる）
const NIGIRI_NETA = [
  { id: 'maguro',  name: 'まぐろ' },
  { id: 'salmon',  name: 'サーモン' },
  { id: 'shiromi', name: 'しろみ' },
  { id: 'ebi',     name: 'えび' },
  { id: 'amaebi',  name: 'あまえび' },
  { id: 'ika',     name: 'いか' },
  { id: 'tako',    name: 'たこ' },
  { id: 'iwashi',  name: 'いわし' },
  { id: 'hotate',  name: 'ほたて' },
  { id: 'anago',   name: 'あなご' },
  { id: 'tamago',  name: 'たまご', dy: 20 },   // たまごは箱型なので少し低め
];
// 軍艦のネタ（ぐんかんの上にのせる）
const GUNKAN_NETA = [
  { id: 'ikura',    name: 'いくら' },
  { id: 'negitoro', name: 'ねぎとろ' },
  { id: 'uni',      name: 'うに' },
  { id: 'salmon_g', name: 'サーモン軍艦' },
  { id: 'corn',     name: 'コーン' },
  { id: 'natto',    name: 'なっとう' },
  { id: 'kyuri',    name: 'きゅうり' },
];
const BASE_PARTS = [
  { id: 'shari',  name: 'シャリ',   dy: 26 },
  { id: 'gunkan', name: 'ぐんかん', dy: 22 },
  { id: 'nori',   name: 'のり',     dy: 20, dx: 8 },
  // わさびはシャリとネタの間。本物と同じで見た目には隠れる
  // （乗せたかどうかは上の「1/1」カウンターで確認できる）
  { id: 'wasabi', name: 'わさび',   dy: 16, dx: -4 },
];
const PARTS = [
  ...BASE_PARTS,
  ...NIGIRI_NETA.map(n => ({ dy: 14, dx: 8, ...n })),
  ...GUNKAN_NETA.map(n => ({ dy: 6, dx: 0, ...n })),
];
const PART_BY_ID = Object.fromEntries(PARTS.map(p => [p.id, p]));
const NIGIRI_IDS = NIGIRI_NETA.map(n => n.id);
const GUNKAN_IDS = GUNKAN_NETA.map(n => n.id);

// 役割ごとに1貫目・2貫目へ振り分ける
// （まぐろ1個＋サーモン1個 のとき、両方が同じ貫に乗ってしまわないように）
function roleOf(id) {
  if (id === 'shari' || id === 'gunkan') return 'base';
  if (id === 'wasabi' || id === 'nori') return id;
  return 'neta';
}
// 注文を「1貫ずつ」に分ける（お手本を貫の数だけ並べるのに使う）
function splitIntoPieces(req, n) {
  const pieces = Array.from({ length: n }, () => ({}));
  const used = {};
  ['base', 'wasabi', 'neta', 'nori'].forEach(role => {
    Object.keys(req).forEach(id => {
      if (roleOf(id) !== role) return;
      for (let k = 0; k < req[id]; k++) {
        const idx = (used[role] || 0); used[role] = idx + 1;
        const p = pieces[idx % n];
        p[id] = (p[id] || 0) + 1;
      }
    });
  });
  return pieces;
}
// 重ね順（シャリが一番下、わさび→ネタ→のり の順で上へ）
const LAYER = { shari: 1, gunkan: 1, wasabi: 2, nori: 4 };
[...NIGIRI_IDS, ...GUNKAN_IDS].forEach(id => { LAYER[id] = 3; });

// お手本：注文されたパーツを実際と同じ重ね方で組み立てて見せる
function SushiPreview({ req, scale, box }) {
  const ids = Object.keys(req).sort((a, b) => LAYER[a] - LAYER[b]);
  return (
    <div style={{ position: 'relative', width: box[0], height: box[1] }}>
      {ids.map(id => {
        const p = PART_BY_ID[id];
        if (!p) return null;
        return (
          <div key={id} style={{
            position: 'absolute', left: '50%', top: '50%', zIndex: LAYER[id],
            transform: `translate(-50%, -50%) translate(${(p.dx || 0) * scale}px, ${p.dy * scale}px)`,
            filter: 'drop-shadow(0 1px 1px rgba(0,0,0,0.25))',
          }}>
            <Sprite name={id} h={partH(id) * scale} />
          </div>
        );
      })}
    </div>
  );
}

// ===== 注文 =====
// お手本は req のパーツから自動で組み立てて表示する
const PLAIN_NIGIRI = NIGIRI_IDS.filter(id => id !== 'tamago');   // たまごは のり付き専用
const EASY_ORDERS = [
  // にぎり1貫（ネタの数だけ種類がある）
  ...PLAIN_NIGIRI.map(id => ({ req: { shari: 1, [id]: 1 }, score: 100 })),
  // ぐんかん1貫
  ...GUNKAN_IDS.map(id => ({ req: { gunkan: 1, [id]: 1 }, score: 140 })),
  // たまご（のり巻き）
  { req: { shari: 1, tamago: 1, nori: 1 }, score: 150 },
  // わさび入り
  ...['maguro', 'salmon', 'tako', 'ika'].map(id => ({ req: { shari: 1, wasabi: 1, [id]: 1 }, score: 160 })),
];
const HARD_ORDERS = [
  // 同じネタで2貫
  ...['maguro', 'salmon', 'ebi', 'tako', 'ika', 'hotate', 'iwashi', 'amaebi'].map(
    id => ({ req: { shari: 2, [id]: 2 }, score: 240 })),
  // ちがうネタを1貫ずつ
  ...[['maguro', 'salmon'], ['ebi', 'ika'], ['tako', 'hotate'], ['iwashi', 'anago'], ['shiromi', 'amaebi']].map(
    ([a, b]) => ({ req: { shari: 2, [a]: 1, [b]: 1 }, score: 260 })),
  // ぐんかん2貫
  ...[['ikura', 'ikura'], ['uni', 'uni'], ['negitoro', 'corn'], ['natto', 'kyuri']].map(
    ([a, b]) => ({ req: a === b ? { gunkan: 2, [a]: 2 } : { gunkan: 2, [a]: 1, [b]: 1 }, score: 320 })),
  { req: { shari: 2, tamago: 2, nori: 2 },   score: 340 },
  { req: { shari: 2, wasabi: 2, maguro: 2 }, score: 350 },
];

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const ROUND_COUNT = 8;
// はじめはかんたんな1貫、あとから2貫が混ざる
function buildRounds() {
  const easy = shuffleArray(EASY_ORDERS);
  const hard = shuffleArray(HARD_ORDERS);
  const rounds = [];
  for (let i = 0; i < ROUND_COUNT; i++) {
    if (i < 4) rounds.push(easy[i % easy.length]);
    else rounds.push(hard[(i - 4) % hard.length]);
  }
  return rounds;
}

let audioCtx = null;
const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };
const playSound = (type) => {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  switch (type) {
    case 'put':
      o.type='sine'; o.frequency.setValueAtTime(400,now); o.frequency.exponentialRampToValueAtTime(120,now+0.1);
      g.gain.setValueAtTime(0.4,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.1);
      o.start(now); o.stop(now+0.1); break;
    case 'grab':
      o.type='triangle'; o.frequency.setValueAtTime(300,now); o.frequency.linearRampToValueAtTime(520,now+0.05);
      g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0.01,now+0.05);
      o.start(now); o.stop(now+0.05); break;
    case 'slide': {
      o.type='sawtooth'; o.frequency.setValueAtTime(150,now); o.frequency.linearRampToValueAtTime(50,now+0.5);
      const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(1000,now); f.frequency.linearRampToValueAtTime(100,now+0.5);
      o.disconnect(); o.connect(f); f.connect(g);
      g.gain.setValueAtTime(0.3,now); g.gain.linearRampToValueAtTime(0.01,now+0.5);
      o.start(now); o.stop(now+0.5); break;
    }
    case 'success': {
      o.type='sine'; o.frequency.setValueAtTime(659.25,now);
      g.gain.setValueAtTime(0.5,now); g.gain.linearRampToValueAtTime(0.01,now+0.2);
      o.start(now); o.stop(now+0.2);
      const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
      o2.type='sine'; o2.frequency.setValueAtTime(830.61,now+0.2);
      g2.gain.setValueAtTime(0,now); g2.gain.setValueAtTime(0.5,now+0.2); g2.gain.exponentialRampToValueAtTime(0.01,now+0.6);
      o2.connect(g2); g2.connect(audioCtx.destination); o2.start(now+0.2); o2.stop(now+0.6); break;
    }
    case 'fail': {
      o.type='sawtooth'; o.frequency.setValueAtTime(150,now);
      g.gain.setValueAtTime(0.3,now); g.gain.linearRampToValueAtTime(0.01,now+0.4);
      const of2=audioCtx.createOscillator(); of2.type='square'; of2.frequency.setValueAtTime(160,now);
      of2.connect(g); of2.start(now); of2.stop(now+0.4);
      o.start(now); o.stop(now+0.4); break;
    }
  }
};

const PLATE = 210;                    // お皿の大きさ(px)
const LANE_HEIGHT = 124;                                              // レーンの見た目の高さ
const LANE_TILE_W = Math.round(LANE_W * (LANE_HEIGHT / LANE_H));      // タイル1枚ぶんの幅
const PLATES = ['plate_red','plate_blue','plate_yellow','plate_green','plate_purple','plate_pink'];

function App() {
  const [gameState, setGameState] = useState('title');
  const [rounds, setRounds] = useState([]);
  const [roundIndex, setRoundIndex] = useState(0);
  const [selectedId, setSelectedId] = useState(null);
  const [score, setScore] = useState(0);
  const [resultStatus, setResultStatus] = useState(null);
  const [isConveying, setIsConveying] = useState(false);
  const [plateColor, setPlateColor] = useState('plate_red');
  const [palette, setPalette] = useState([]);
  const [ready, setReady] = useState(false);
  const [, setTick] = useState(0);

  const itemsRef = useRef([]);
  const maxZRef = useRef(10);
  const dragRef = useRef(null);

  const order = rounds[roundIndex];
  const items = itemsRef.current;
  const bump = () => setTick(n => n + 1);

  useEffect(() => {
    const img = new Image();
    img.onload = () => setReady(true);
    img.onerror = () => setReady(true);
    img.src = ATLAS_SRC;
  }, []);

  // 材料は毎回「その注文に必要なもの＋おじゃまのネタ」だけ並べる
  // （全種類ならべると多すぎて探せないため）
  useEffect(() => {
    const o = rounds[roundIndex];
    if (!o) return;
    const base = BASE_PARTS.map(p => p.id);
    const needNeta = Object.keys(o.req).filter(id => !base.includes(id));
    const pool = [...NIGIRI_IDS, ...GUNKAN_IDS].filter(id => !needNeta.includes(id));
    const decoys = shuffleArray(pool).slice(0, Math.max(0, 6 - needNeta.length));
    setPalette([...base, ...shuffleArray([...needNeta, ...decoys])]);
  }, [rounds, roundIndex]);

  const startGame = () => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    setRounds(buildRounds());
    setRoundIndex(0);
    setScore(0);
    setGameState('playing');
    resetPlate();
  };

  const resetPlate = () => {
    itemsRef.current = [];
    maxZRef.current = 10;
    setSelectedId(null);
    setResultStatus(null);
    setIsConveying(false);
    setPlateColor(PLATES[Math.floor(Math.random() * PLATES.length)]);
    bump();
  };

  // 2貫の注文なら左右2か所に自動で並ぶ
  const slotsFor = (o) => {
    if (!o) return [0];
    const bases = (o.req.shari || 0) + (o.req.gunkan || 0);
    return bases >= 2 ? [-42, 42] : [0];
  };

  const addPart = (part) => {
    if (isConveying || gameState !== 'playing' || resultStatus !== null) return;
    initAudio(); playSound('put');
    const slots = slotsFor(order);
    // 同じ役割（シャリ／ネタ／わさび／のり）の中で何個目かで置き場所を決める
    const nth = itemsRef.current.filter(i => roleOf(i.baseId) === roleOf(part.id)).length;
    const sx = slots[nth % slots.length];
    itemsRef.current = [...itemsRef.current, {
      id: `it-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
      baseId: part.id,
      x: PLATE / 2 + sx + (part.dx || 0),
      y: PLATE / 2 + part.dy,
      rotation: 0,
      zIndex: (LAYER[part.id] || 1) * 100 + nth,
    }];
    bump();
  };

  const onPointerDown = (e, item) => {
    if (isConveying || resultStatus !== null) return;
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    initAudio(); playSound('grab');
    setSelectedId(item.id);
    dragRef.current = { id: item.id, sx: item.x, sy: item.y, px: e.clientX, py: e.clientY, moved: false };
  };
  const onPointerMove = (e) => {
    const d = dragRef.current;
    if (!d) return;
    d.moved = true;
    itemsRef.current = itemsRef.current.map(i =>
      i.id === d.id ? { ...i, x: d.sx + (e.clientX - d.px), y: d.sy + (e.clientY - d.py) } : i);
    bump();
  };
  const onPointerUp = () => {
    if (dragRef.current && dragRef.current.moved) playSound('put');
    dragRef.current = null;
  };

  const undo = () => {
    if (isConveying || resultStatus !== null || itemsRef.current.length === 0) return;
    playSound('grab');
    itemsRef.current = itemsRef.current.slice(0, -1);
    setSelectedId(null); bump();
  };
  const clearAll = () => {
    if (isConveying || resultStatus !== null || itemsRef.current.length === 0) return;
    playSound('grab');
    itemsRef.current = []; setSelectedId(null); bump();
  };

  // お皿の上にあるか（やさしめの楕円判定）
  const isOnPlate = (item) => {
    const dx = (item.x - PLATE / 2) / (PLATE * 0.52);
    const dy = (item.y - PLATE / 2) / (PLATE * 0.50);
    return dx * dx + dy * dy <= 1;
  };

  // 今お皿に乗っている部品の数
  const counts = {};
  items.forEach(i => { if (isOnPlate(i)) counts[i.baseId] = (counts[i.baseId] || 0) + 1; });
  const req = order ? order.req : {};
  const pieceCount = (req.shari || 0) + (req.gunkan || 0);   // 何貫の注文か
  const isPerfect = order &&
    Object.keys(req).length === Object.keys(counts).length &&
    Object.keys(req).every(k => counts[k] === req[k]);
  // 注文にない部品が乗っている？
  const extras = Object.keys(counts).filter(k => !req[k]);

  const submit = () => {
    if (isConveying || resultStatus !== null || !order) return;
    setSelectedId(null);
    if (isPerfect) {
      playSound('success'); setTimeout(() => playSound('slide'), 450);
      setResultStatus('success'); setIsConveying(true);
      setScore(s => s + order.score);
      setTimeout(() => {
        const next = roundIndex + 1;
        if (next >= rounds.length) setGameState('result');
        else { setRoundIndex(next); resetPlate(); }
      }, 2100);
    } else {
      playSound('fail'); setResultStatus('fail');
      setTimeout(() => setResultStatus(null), 1200);
    }
  };

  const renderPart = (item) => {
    const p = PART_BY_ID[item.baseId];
    if (!p) return null;
    const sel = item.id === selectedId;
    return (
      <div key={item.id}
        onPointerDown={(e) => onPointerDown(e, item)}
        className="absolute origin-center cursor-grab active:cursor-grabbing"
        style={{
          left: 0, top: 0,
          transform: `translate(${item.x}px, ${item.y}px) rotate(${item.rotation}deg) translate(-50%, -50%)`,
          zIndex: item.zIndex, touchAction: 'none',
          filter: sel ? 'drop-shadow(0 0 5px #2563eb) drop-shadow(0 0 5px #2563eb)'
                      : 'drop-shadow(0 2px 2px rgba(0,0,0,0.22))',
        }}>
        <Sprite name={item.baseId} h={partH(item.baseId)} />
      </div>
    );
  };

  return (
    <div className="flex flex-col h-[100dvh] w-full bg-[#f0e6d2] overflow-hidden font-sans">
      <style>{`
        @keyframes laneScroll { from { background-position-x: 0; } to { background-position-x: -${LANE_TILE_W}px; } }
        .conveying-plate { transition: transform 1.9s ease-in; transform: translateX(120vw) rotate(6deg); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shakeIcon { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-15px) rotate(-10deg); } 50% { transform: translateX(15px) rotate(10deg); } 75% { transform: translateX(-15px) rotate(-10deg); } }
        .animate-pop-in { animation: popIn 0.4s ease-out forwards; }
        .animate-shake-icon { animation: shakeIcon 0.5s ease-in-out; }
      `}</style>

      {gameState === 'title' && (
        <div className="absolute inset-0 z-50 flex flex-col items-center justify-center gp-cover text-white p-6">
          <a href="index.html" className="gp-home">🏠</a>
          <div className="gp-hero gp-float mb-6">🍣</div>
          <h1 className="gp-title mb-4 text-center text-white">オーダー回転寿司</h1>
          <p className="mb-6 text-center text-sm text-white/85 leading-relaxed">
            おてほんと おなじ おすしを つくろう！<br/>
            したの ざいりょうを タップして<br/>
            シャリに ネタを のせてね
          </p>
          <button onClick={startGame} disabled={!ready} className="gp-btn gp-btn--lg mt-2 disabled:opacity-50">
            {ready ? 'スタート' : 'よみこみちゅう…'}
          </button>
        </div>
      )}

      {gameState === 'result' && (
        <div className="absolute inset-0 z-50 flex flex-col items-center justify-center gp-cover text-white p-6">
          <div className="gp-hero gp-float mb-6">🏆</div>
          <h2 className="gp-title mb-2 text-white">えいぎょうしゅうりょう！</h2>
          <p className="text-xl text-gray-300 mb-8">きょうのスコア</p>
          <div className="text-6xl font-black text-[#f1c40f] mb-12 drop-shadow-lg">{score}</div>
          <div className="flex gap-4">
            <button onClick={() => window.location.href = 'index.html'} className="gp-btn gp-btn--ghost">🏠 もどる</button>
            <button onClick={startGame} className="gp-btn">もういちど</button>
          </div>
        </div>
      )}

      {gameState === 'playing' && order && (
        <>
          <header className="bg-slate-800 text-white px-3 py-2 flex justify-between items-center shadow-md z-20 shrink-0">
            <a href="index.html" className="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-lg no-underline">🏠</a>
            <div className="font-bold text-lg">スコア: <span className="text-yellow-400">{score}</span></div>
            <div className="text-xs text-gray-400">{roundIndex + 1}/{rounds.length}</div>
          </header>

          {/* お手本＋いま乗っているものの数 */}
          <div className="bg-white border-b-4 border-red-500 px-3 py-2 z-10 shadow-sm shrink-0">
            <div className="flex items-center gap-3">
              <div className="shrink-0 text-center">
                <div className="text-[10px] font-black text-red-600 mb-1 bg-red-100 px-2 py-0.5 rounded-full">おてほん</div>
                {/* 2貫の注文なら お寿司の絵も2つならべる（数字は使わない） */}
                <div className="flex justify-center items-end gap-0.5">
                  {splitIntoPieces(req, Math.max(1, pieceCount)).map((piece, i) => (
                    <SushiPreview key={i} req={piece} scale={pieceCount >= 2 ? 0.46 : 0.62}
                      box={pieceCount >= 2 ? [56, 52] : [76, 58]} />
                  ))}
                </div>
              </div>
              {/* いくつ乗せたか、ひと目でわかるカウンター */}
              <div className="flex flex-wrap gap-1.5 flex-1">
                {Object.entries(req).map(([id, need]) => {
                  const have = counts[id] || 0;
                  const ok = have === need;
                  const over = have > need;
                  return (
                    <div key={id} data-part={id} data-have={have} data-need={need}
                      className={`flex items-center rounded-full pl-1 pr-2 py-0.5 border-2 gap-1
                        ${over ? 'bg-red-50 border-red-400' : ok ? 'bg-green-50 border-green-400' : 'bg-gray-50 border-gray-200'}`}>
                      <Sprite name={id} h={24} />
                      {/* 必要な数だけ丸をならべて、のせたぶんだけ塗る（数字は読めなくてもわかる） */}
                      <div className="flex gap-0.5">
                        {Array.from({ length: need }).map((_, i) => (
                          <span key={i}
                            className={`w-3 h-3 rounded-full border-2 ${i < have ? 'bg-green-500 border-green-600' : 'bg-white border-gray-300'}`} />
                        ))}
                        {over && <span className="w-3 h-3 rounded-full bg-red-500 border-2 border-red-600" />}
                      </div>
                    </div>
                  );
                })}
                {extras.length > 0 && (
                  <div className="flex items-center rounded-full px-2 py-0.5 border-2 border-red-300 bg-red-50 gap-1">
                    <span className="text-xs font-black text-red-500">よぶんなざいりょう</span>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* 作業スペース */}
          <main className="flex-1 relative overflow-hidden bg-[#e9edf2] flex flex-col min-h-0"
            onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}
            onClick={() => { if (!isConveying) setSelectedId(null); }}>
            <div className="absolute top-1/2 left-0 w-full -translate-y-1/2 pointer-events-none"
              style={{
                height: LANE_HEIGHT,
                backgroundImage: `url(${LANE_SRC})`,
                backgroundSize: `${LANE_TILE_W}px ${LANE_HEIGHT}px`,
                backgroundRepeat: 'repeat-x',
                animation: 'laneScroll 3.2s linear infinite',
              }} />

            <div className="flex-1 relative flex justify-center items-center">
              <div className={`relative flex justify-center items-center ${isConveying ? 'conveying-plate' : ''}`}
                style={{ width: PLATE, height: PLATE, touchAction: 'none' }}>
                <Sprite name={plateColor} h={PLATE}
                  style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)',
                           filter: 'drop-shadow(0 6px 8px rgba(0,0,0,0.25))', pointerEvents: 'none' }} />
                {items.map(renderPart)}
              </div>
            </div>

            {resultStatus === 'success' && (
              <div className="absolute inset-0 z-50 flex justify-center items-center pointer-events-none">
                <div className="text-[150px] text-red-500 font-bold drop-shadow-[0_0_15px_rgba(255,255,255,1)] animate-pop-in">⭕️</div>
              </div>
            )}
            {resultStatus === 'fail' && (
              <div className="absolute inset-0 z-50 flex justify-center items-center pointer-events-none bg-black/20">
                <div className="text-[150px] text-blue-500 font-bold drop-shadow-[0_0_15px_rgba(255,255,255,1)] animate-shake-icon">❌</div>
              </div>
            )}

            <div className="absolute bottom-2 left-3 z-10 flex gap-2">
              <button onClick={undo} disabled={isConveying || resultStatus !== null || items.length === 0}
                className={`w-14 h-14 flex items-center justify-center active:scale-95 transition-transform ${(isConveying || resultStatus !== null || items.length === 0) ? 'opacity-40' : ''}`}
                style={{ filter: 'drop-shadow(0 3px 3px rgba(0,0,0,0.3))' }}>
                <Sprite name="btn_back" h={54} />
              </button>
              <button onClick={clearAll} disabled={isConveying || resultStatus !== null || items.length === 0}
                className={`w-14 h-14 flex items-center justify-center active:scale-95 transition-transform ${(isConveying || resultStatus !== null || items.length === 0) ? 'opacity-40' : ''}`}
                style={{ filter: 'drop-shadow(0 3px 3px rgba(0,0,0,0.3))' }}>
                <Sprite name="btn_clear" h={54} />
              </button>
            </div>
            <div className="absolute bottom-2 right-3 z-10">
              <button onClick={submit} disabled={isConveying || resultStatus !== null}
                className={`w-20 h-20 flex items-center justify-center active:scale-95 transition-transform ${(isConveying || resultStatus !== null) ? 'opacity-40' : (isPerfect ? 'animate-pulse' : '')}`}
                style={{ filter: 'drop-shadow(0 4px 5px rgba(0,0,0,0.35))' }}>
                <Sprite name="btn_go" h={80} />
              </button>
            </div>
          </main>

          {/* 材料パレット */}
          <div className="bg-gray-200 px-2 py-2 shrink-0" style={{ paddingBottom: 'max(8px, env(safe-area-inset-bottom))' }}>
            <div className={`bg-white p-2 rounded-xl border border-gray-200 overflow-x-auto whitespace-nowrap shadow-lg ${isConveying || resultStatus !== null ? 'opacity-50 pointer-events-none' : ''}`}>
              <div className="flex gap-1.5 px-0.5">
                {palette.map(id => {
                  const p = PART_BY_ID[id];
                  if (!p) return null;
                  const needed = !!req[p.id];
                  return (
                    <button key={p.id} onClick={() => addPart(p)}
                      className={`flex flex-col items-center min-w-[62px] p-1 rounded-lg shadow-sm border-2 active:scale-95 transition-all
                        ${needed ? 'bg-yellow-50 border-yellow-400' : 'bg-gray-50 border-gray-200'}`}>
                      <div className="h-11 flex items-end justify-center pointer-events-none">
                        <Sprite name={p.id} h={Math.min(40, partH(p.id) * 0.8)} />
                      </div>
                      <span className="text-[9px] text-gray-600 font-bold leading-none mt-0.5">{p.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
