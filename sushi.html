<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>オーダー回転寿司</title>
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
<script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: sans-serif;
  user-select: none;
  touch-action: manipulation;
  overscroll-behavior: none;
  overflow: hidden;
}
</style>
<link rel="stylesheet" href="assets/kit.css">
</head>
<body class="gp gp-red gp-dark">
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ===== スプライトアトラス =====
const ATLAS_SRC = 'sushi_atlas.png';
const ATLAS_W = 1400, ATLAS_H = 1010;
const FRAMES = {"plate_red":[0,0,330,323],"btn_go":[334,0,169,172],"plate_green":[507,0,180,166],"plate_blue":[691,0,181,165],"plate_yellow":[876,0,179,165],"plate_soy":[1059,0,182,165],"plate_pink":[0,327,180,163],"plate_purple":[184,327,184,162],"shiso":[372,327,122,151],"tong":[498,327,193,139],"salmon_g":[695,327,135,139],"lane":[0,494,739,138],"lane_end":[743,494,201,138],"ikura":[948,494,137,134],"corn":[1089,494,139,134],"negitoro":[1232,494,140,133],"natto":[0,636,139,133],"uni":[143,636,137,132],"kappa":[284,636,124,129],"amaebi":[412,636,203,123],"btn_back":[619,636,119,120],"maguro":[742,636,204,119],"btn_clear":[950,636,121,119],"ebi":[1075,636,213,118],"hikari":[0,773,209,118],"hotate":[213,773,172,118],"anago":[389,773,193,116],"tako":[586,773,189,116],"ika":[779,773,191,115],"salmon":[974,773,193,114],"tamago":[1171,773,170,112],"salmon2":[0,895,197,111],"shiromi":[201,895,203,110],"baran":[408,895,123,102],"gari":[535,895,114,95],"wasabi":[653,895,66,70]};

// 高さ h(px) にあわせてスプライトを表示する div のスタイルを返す
function spriteStyle(name, h) {
  const f = FRAMES[name];
  if (!f) return {};
  const scale = h / f[3];
  return {
    width: f[2] * scale + 'px',
    height: h + 'px',
    backgroundImage: `url(${ATLAS_SRC})`,
    backgroundSize: `${ATLAS_W * scale}px ${ATLAS_H * scale}px`,
    backgroundPosition: `-${f[0] * scale}px -${f[1] * scale}px`,
    backgroundRepeat: 'no-repeat',
  };
}
function Sprite({ name, h, className, style }) {
  return <div className={className} style={{ ...spriteStyle(name, h), ...(style || {}) }} />;
}

// ===== 寿司ネタ一覧 =====
const SUSHI = [
  { id: 'maguro',   name: 'まぐろ' },
  { id: 'salmon',   name: 'サーモン' },
  { id: 'ebi',      name: 'えび' },
  { id: 'tamago',   name: 'たまご' },
  { id: 'ika',      name: 'いか' },
  { id: 'tako',     name: 'たこ' },
  { id: 'shiromi',  name: 'しろみ' },
  { id: 'hikari',   name: 'ひかりもの' },
  { id: 'amaebi',   name: 'あまえび' },
  { id: 'hotate',   name: 'ほたて' },
  { id: 'anago',    name: 'あなご' },
  { id: 'ikura',    name: 'いくら' },
  { id: 'uni',      name: 'うに' },
  { id: 'negitoro', name: 'ネギトロ' },
  { id: 'salmon_g', name: 'サーモン軍艦' },
  { id: 'corn',     name: 'コーン' },
  { id: 'natto',    name: 'なっとう' },
  { id: 'kappa',    name: 'かっぱ' },
];
const SUSHI_BY_ID = Object.fromEntries(SUSHI.map(s => [s.id, s]));

// お皿の色（流したときの見た目のバリエーション）
const PLATES = ['plate_red', 'plate_blue', 'plate_yellow', 'plate_green', 'plate_purple', 'plate_pink'];

// ===== 注文の作りかた =====
// ラウンドが進むほど品数が増える（1→3）
function makeOrder(round) {
  const maxItems = round < 3 ? 1 : (round < 6 ? 2 : 3);
  const n = 1 + Math.floor(Math.random() * maxItems);
  const pool = shuffleArray(SUSHI).slice(0, n);
  const req = {};
  pool.forEach(s => { req[s.id] = 1; });
  // たまに同じネタ2貫
  if (n <= 2 && Math.random() < 0.35) {
    const k = pool[0].id;
    req[k] = 2;
  }
  const totalPieces = Object.values(req).reduce((a, b) => a + b, 0);
  return { requiredCounts: req, score: 100 * totalPieces };
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let audioCtx = null;
const initAudio = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); };

const playSound = (type) => {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  switch (type) {
    case 'put':
      o.type='sine'; o.frequency.setValueAtTime(400,now); o.frequency.exponentialRampToValueAtTime(120,now+0.1);
      g.gain.setValueAtTime(0.4,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.1);
      o.start(now); o.stop(now+0.1); break;
    case 'grab':
      o.type='triangle'; o.frequency.setValueAtTime(300,now); o.frequency.linearRampToValueAtTime(520,now+0.05);
      g.gain.setValueAtTime(0.2,now); g.gain.linearRampToValueAtTime(0.01,now+0.05);
      o.start(now); o.stop(now+0.05); break;
    case 'slide': {
      o.type='sawtooth'; o.frequency.setValueAtTime(150,now); o.frequency.linearRampToValueAtTime(50,now+0.5);
      const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(1000,now); f.frequency.linearRampToValueAtTime(100,now+0.5);
      o.disconnect(); o.connect(f); f.connect(g);
      g.gain.setValueAtTime(0.3,now); g.gain.linearRampToValueAtTime(0.01,now+0.5);
      o.start(now); o.stop(now+0.5); break;
    }
    case 'success': {
      o.type='sine'; o.frequency.setValueAtTime(659.25,now);
      g.gain.setValueAtTime(0.5,now); g.gain.linearRampToValueAtTime(0.01,now+0.2);
      o.start(now); o.stop(now+0.2);
      const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
      o2.type='sine'; o2.frequency.setValueAtTime(830.61,now+0.2);
      g2.gain.setValueAtTime(0,now); g2.gain.setValueAtTime(0.5,now+0.2); g2.gain.exponentialRampToValueAtTime(0.01,now+0.6);
      o2.connect(g2); g2.connect(audioCtx.destination); o2.start(now+0.2); o2.stop(now+0.6); break;
    }
    case 'fail': {
      o.type='sawtooth'; o.frequency.setValueAtTime(150,now);
      g.gain.setValueAtTime(0.3,now); g.gain.linearRampToValueAtTime(0.01,now+0.4);
      const of2=audioCtx.createOscillator(); of2.type='square'; of2.frequency.setValueAtTime(160,now);
      of2.connect(g); of2.start(now); of2.stop(now+0.4);
      o.start(now); o.stop(now+0.4); break;
    }
  }
};

const ROUND_COUNT = 8;
const PLATE_SIZE = 210;   // お皿の直径(px)

function App() {
  const [gameState, setGameState] = useState('title');
  const [orders, setOrders] = useState([]);
  const [currentOrderIndex, setCurrentOrderIndex] = useState(0);
  const [selectedId, setSelectedId] = useState(null);
  const maxZRef = useRef(10);
  const dragInfoRef = useRef(null);
  const itemsRef = useRef([]);
  const [, setRenderTick] = useState(0);
  const [score, setScore] = useState(0);
  const [resultStatus, setResultStatus] = useState(null);
  const [isConveying, setIsConveying] = useState(false);
  const [plateColor, setPlateColor] = useState('plate_red');
  const [ready, setReady] = useState(false);

  const workspaceRef = useRef(null);
  const currentOrder = orders[currentOrderIndex];
  const items = itemsRef.current;

  useEffect(() => {
    const img = new Image();
    img.onload = () => setReady(true);
    img.src = ATLAS_SRC;
  }, []);

  const bump = () => setRenderTick(n => n + 1);
  const updateItems = (updater) => {
    itemsRef.current = typeof updater === 'function' ? updater(itemsRef.current) : updater;
    bump();
  };

  const startGame = () => {
    initAudio();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    const os = [];
    for (let i = 0; i < ROUND_COUNT; i++) os.push(makeOrder(i));
    setOrders(os);
    setGameState('playing');
    setScore(0);
    setCurrentOrderIndex(0);
    resetOrder();
  };

  const resetOrder = () => {
    itemsRef.current = [];
    bump();
    setSelectedId(null);
    setResultStatus(null);
    setIsConveying(false);
    maxZRef.current = 10;
    setPlateColor(PLATES[Math.floor(Math.random() * PLATES.length)]);
  };

  const handlePointerDown = (e, id, item) => {
    if (isConveying || gameState !== 'playing' || resultStatus !== null) return;
    e.stopPropagation();
    e.target.setPointerCapture(e.pointerId);
    initAudio(); playSound('grab');
    const nz = ++maxZRef.current;
    updateItems(prev => prev.map(i => i.id === id ? { ...i, zIndex: nz } : i));
    setSelectedId(id);
    dragInfoRef.current = { id, startX: item.x, startY: item.y, pointerX: e.clientX, pointerY: e.clientY, moved: false };
  };

  const handlePointerMove = (e) => {
    const di = dragInfoRef.current;
    if (!di) return;
    di.moved = true;
    const nx = di.startX + (e.clientX - di.pointerX);
    const ny = di.startY + (e.clientY - di.pointerY);
    itemsRef.current = itemsRef.current.map(i => i.id === di.id ? { ...i, x: nx, y: ny } : i);
    bump();
  };

  const handlePointerUp = () => { if (dragInfoRef.current) { if (dragInfoRef.current.moved) playSound('put'); dragInfoRef.current = null; } };
  const handleWorkspaceClick = () => { if (!isConveying) setSelectedId(null); };

  const addSushi = (sushi) => {
    if (isConveying || gameState !== 'playing' || resultStatus !== null) return;
    initAudio(); playSound('put');
    const ox = Math.random() * 30 - 15, oy = Math.random() * 24 - 12;
    const newId = `item-${Date.now()}-${Math.floor(Math.random()*1000)}`;
    const nz = ++maxZRef.current;
    itemsRef.current = [...itemsRef.current, {
      id: newId, baseId: sushi.id, x: PLATE_SIZE/2 + ox, y: PLATE_SIZE/2 + oy, rotation: 0, zIndex: nz,
    }];
    bump();
    setSelectedId(newId);
  };

  const deleteSelectedItem = () => {
    if (!selectedId || isConveying) return;
    playSound('grab'); updateItems(prev => prev.filter(i => i.id !== selectedId)); setSelectedId(null);
  };

  const clearAllItems = () => {
    if (isConveying || resultStatus !== null) return;
    playSound('grab'); itemsRef.current = []; bump(); setSelectedId(null);
  };

  const undoLastItem = () => {
    if (isConveying || resultStatus !== null || itemsRef.current.length === 0) return;
    playSound('grab');
    const removed = itemsRef.current[itemsRef.current.length - 1];
    itemsRef.current = itemsRef.current.slice(0, -1);
    bump();
    if (selectedId === removed.id) setSelectedId(null);
  };

  // お皿の上にあるか（中心からの楕円距離）
  const isOnPlate = (item) => {
    const dx = (item.x - PLATE_SIZE/2) / (PLATE_SIZE*0.46);
    const dy = (item.y - PLATE_SIZE/2) / (PLATE_SIZE*0.40);
    return dx*dx + dy*dy <= 1;
  };

  const submitSushi = () => {
    if (isConveying || resultStatus !== null || !currentOrder) return;
    setSelectedId(null);
    const cc = {};
    itemsRef.current.forEach(item => { if (isOnPlate(item)) cc[item.baseId] = (cc[item.baseId] || 0) + 1; });
    const req = currentOrder.requiredCounts;
    const reqKeys = Object.keys(req);
    let ok = reqKeys.length === Object.keys(cc).length;
    if (ok) { for (const k of reqKeys) { if (cc[k] !== req[k]) { ok = false; break; } } }
    if (ok) {
      playSound('success'); setTimeout(() => playSound('slide'), 500);
      setResultStatus('success'); setIsConveying(true);
      setScore(prev => prev + currentOrder.score);
      setTimeout(() => {
        const next = currentOrderIndex + 1;
        if (next >= orders.length) setGameState('result');
        else { setCurrentOrderIndex(next); resetOrder(); }
      }, 2200);
    } else {
      playSound('fail'); setResultStatus('fail');
      setTimeout(() => setResultStatus(null), 1300);
    }
  };

  // お手本プレビュー用に、注文の寿司を皿に並べた配置を作る
  const previewItems = currentOrder ? (() => {
    const list = [];
    Object.entries(currentOrder.requiredCounts).forEach(([id, cnt]) => {
      for (let i = 0; i < cnt; i++) list.push(id);
    });
    return list;
  })() : [];

  const selectedItemData = items.find(i => i.id === selectedId);
  const onPlateCount = items.filter(isOnPlate).length;

  // 皿の上に置かれた寿司スプライト
  const renderSushi = (item) => {
    const s = SUSHI_BY_ID[item.baseId];
    if (!s) return null;
    const isSel = item.id === selectedId;
    const h = 66;
    return (
      <div key={item.id}
        onPointerDown={(e) => handlePointerDown(e, item.id, item)}
        className="absolute origin-center cursor-grab active:cursor-grabbing"
        style={{
          transform: `translate(${item.x}px, ${item.y}px) rotate(${item.rotation}deg) translate(-50%, -50%)`,
          zIndex: item.zIndex, touchAction: 'none',
          filter: isSel ? 'drop-shadow(0 0 6px #3b82f6) drop-shadow(0 0 6px #3b82f6)' : 'drop-shadow(0 3px 3px rgba(0,0,0,0.25))',
        }}>
        <Sprite name={item.baseId} h={h} />
      </div>
    );
  };

  return (
    <div className="flex flex-col h-[100dvh] w-full bg-[#f0e6d2] overflow-hidden font-sans">
      <style>{`
        @keyframes laneScroll { from { background-position-x: 0; } to { background-position-x: -160px; } }
        .conveying-plate { transition: transform 2s ease-in; transform: translateX(120vw) rotate(8deg); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 70% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes shakeIcon { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-15px) rotate(-10deg); } 50% { transform: translateX(15px) rotate(10deg); } 75% { transform: translateX(-15px) rotate(-10deg); } }
        .animate-pop-in { animation: popIn 0.4s ease-out forwards; }
        .animate-shake-icon { animation: shakeIcon 0.5s ease-in-out; }
      `}</style>

      {gameState === 'title' && (
        <div className="absolute inset-0 z-50 flex flex-col items-center justify-center gp-cover text-white p-6">
          <a href="index.html" className="gp-home">🏠</a>
          <div className="gp-hero gp-float mb-6">🍣</div>
          <h1 className="gp-title mb-4 text-center text-white">オーダー回転寿司</h1>
          <p className="mb-6 text-center text-sm text-white/80 leading-relaxed">
            おきゃくさんの ちゅうもんの おすしを<br/>
            したから えらんで おさらに のせて<br/>
            「レーンに ながす」で かんせい！
          </p>
          <button onClick={startGame} disabled={!ready} className="gp-btn gp-btn--lg mt-2 disabled:opacity-50">
            {ready ? 'スタート' : 'よみこみちゅう…'}
          </button>
        </div>
      )}

      {gameState === 'result' && (
        <div className="absolute inset-0 z-50 flex flex-col items-center justify-center gp-cover text-white p-6">
          <div className="gp-hero gp-float mb-6">🏆</div>
          <h2 className="gp-title mb-2 text-white">えいぎょうしゅうりょう！</h2>
          <p className="text-xl text-gray-300 mb-8">きょうのスコア</p>
          <div className="text-6xl font-black text-[#f1c40f] mb-12 drop-shadow-lg">{score}</div>
          <div className="flex gap-4">
            <button onClick={() => window.location.href = 'index.html'} className="gp-btn gp-btn--ghost">🏠 もどる</button>
            <button onClick={startGame} className="gp-btn">もういちど</button>
          </div>
        </div>
      )}

      {gameState === 'playing' && currentOrder && (
        <>
          {/* ヘッダー */}
          <header className="bg-slate-800 text-white px-3 py-2 flex justify-between items-center shadow-md z-20 shrink-0">
            <a href="index.html" className="w-9 h-9 bg-white/20 rounded-full flex items-center justify-center text-lg no-underline">🏠</a>
            <div className="font-bold text-lg">スコア: <span className="text-yellow-400">{score}</span></div>
            <div className="text-xs text-gray-400">{currentOrderIndex + 1}/{orders.length}</div>
          </header>

          {/* お手本エリア（お客さんの注文） */}
          <div className="bg-white border-b-4 border-red-500 px-3 py-2 z-10 shadow-sm shrink-0">
            <div className="flex items-center gap-3">
              <div className="shrink-0 flex flex-col items-center">
                <div className="text-[10px] font-black text-red-600 mb-1 bg-red-100 px-2 py-0.5 rounded-full">ちゅうもん</div>
                <div className="text-2xl">🧑‍🍼</div>
              </div>
              {/* 注文された寿司を皿にのせた見本 */}
              <div className="relative shrink-0 flex justify-center items-center" style={{ width: 96, height: 72 }}>
                <Sprite name={plateColor} h={64} style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)' }} />
                <div className="absolute inset-0 flex justify-center items-center gap-0.5">
                  {previewItems.map((id, i) => (
                    <Sprite key={i} name={id} h={34} style={{ marginLeft: i > 0 ? -10 : 0, filter: 'drop-shadow(0 2px 2px rgba(0,0,0,0.3))' }} />
                  ))}
                </div>
              </div>
              {/* 材料リスト */}
              <div className="flex flex-wrap gap-1.5 flex-1">
                {Object.entries(currentOrder.requiredCounts).map(([id, count]) => (
                  <div key={id} className="flex items-center bg-gray-50 rounded-full pl-1 pr-2.5 py-0.5 border border-gray-200 gap-1">
                    <Sprite name={id} h={26} />
                    <span className="text-sm font-black text-gray-700">×{count}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* ワークスペース */}
          <main className="flex-1 relative overflow-hidden bg-[#e9edf2] flex flex-col min-h-0"
            onPointerMove={handlePointerMove} onPointerUp={handlePointerUp} onPointerLeave={handlePointerUp} onClick={handleWorkspaceClick}>
            {/* レーン背景 */}
            <div className="absolute top-1/2 left-0 w-full -translate-y-1/2 pointer-events-none"
              style={{
                height: 120,
                backgroundImage: `url(${ATLAS_SRC})`,
                ...(() => { const f = FRAMES['lane']; const scale = 120 / f[3];
                  return { backgroundSize: `${f[2]*scale}px ${ATLAS_H*scale}px`, backgroundPositionY: `-${f[1]*scale}px` }; })(),
                backgroundRepeat: 'repeat-x',
                animation: 'laneScroll 3s linear infinite',
                opacity: 0.95,
              }} />

            <div className="flex-1 relative flex justify-center items-center">
              <div ref={workspaceRef}
                className={`relative flex justify-center items-center ${isConveying ? 'conveying-plate' : ''}`}
                style={{ width: PLATE_SIZE, height: PLATE_SIZE, touchAction: 'none' }}>
                {/* お皿 */}
                <Sprite name={plateColor} h={PLATE_SIZE} style={{ position: 'absolute', left: '50%', top: '50%', transform: 'translate(-50%,-50%)', filter: 'drop-shadow(0 6px 8px rgba(0,0,0,0.25))', pointerEvents: 'none' }} />
                {items.map(renderSushi)}
                {items.length > 0 && (
                  <div className="absolute -top-1 -left-1 bg-blue-500 text-white text-xs font-black w-6 h-6 rounded-full flex items-center justify-center shadow z-50">{onPlateCount}</div>
                )}
              </div>
            </div>

            {resultStatus === 'success' && (
              <div className="absolute inset-0 z-50 flex justify-center items-center pointer-events-none">
                <div className="text-[150px] text-red-500 font-bold drop-shadow-[0_0_15px_rgba(255,255,255,1)] animate-pop-in">⭕️</div>
              </div>
            )}
            {resultStatus === 'fail' && (
              <div className="absolute inset-0 z-50 flex justify-center items-center pointer-events-none bg-black/20">
                <div className="text-[150px] text-blue-500 font-bold drop-shadow-[0_0_15px_rgba(255,255,255,1)] animate-shake-icon">❌</div>
              </div>
            )}

            {/* 戻す・全消し */}
            <div className="absolute bottom-2 left-3 z-10 flex gap-2">
              <button onClick={undoLastItem} disabled={isConveying || resultStatus !== null || items.length === 0}
                className={`w-14 h-14 rounded-full flex items-center justify-center transition-transform active:scale-95 ${(isConveying || resultStatus !== null || items.length === 0) ? 'opacity-40' : ''}`}
                style={{ filter: 'drop-shadow(0 3px 3px rgba(0,0,0,0.3))' }}>
                <Sprite name="btn_back" h={54} />
              </button>
              <button onClick={clearAllItems} disabled={isConveying || resultStatus !== null || items.length === 0}
                className={`w-14 h-14 rounded-full flex items-center justify-center transition-transform active:scale-95 ${(isConveying || resultStatus !== null || items.length === 0) ? 'opacity-40' : ''}`}
                style={{ filter: 'drop-shadow(0 3px 3px rgba(0,0,0,0.3))' }}>
                <Sprite name="btn_clear" h={54} />
              </button>
            </div>
            {/* レーンに流す */}
            <div className="absolute bottom-2 right-3 z-10">
              <button onClick={submitSushi} disabled={isConveying || resultStatus !== null}
                className={`w-20 h-20 rounded-full flex items-center justify-center transition-transform active:scale-95 ${(isConveying || resultStatus !== null) ? 'opacity-40' : ''}`}
                style={{ filter: 'drop-shadow(0 4px 5px rgba(0,0,0,0.35))' }}>
                <Sprite name="btn_go" h={80} />
              </button>
            </div>
          </main>

          {/* コントロールパネル（選択中の寿司の回転・削除） */}
          {!isConveying && selectedItemData && resultStatus === null && (
            <div className="bg-white px-3 py-1.5 border-t border-gray-200 flex gap-3 justify-between items-center z-10 shadow-lg shrink-0">
              <div className="flex flex-col flex-1 max-w-[180px]">
                <label className="text-[10px] text-gray-500 font-bold">かいてん</label>
                <input type="range" min="0" max="360" value={selectedItemData.rotation}
                  onChange={(e) => updateItems(prev => prev.map(i => i.id === selectedId ? { ...i, rotation: Number(e.target.value) } : i))}
                  className="w-full accent-red-500" />
              </div>
              <button onClick={deleteSelectedItem} className="px-3 py-2 bg-red-100 text-red-600 rounded-lg font-bold text-sm">🗑 けす</button>
            </div>
          )}

          {/* 寿司パレット */}
          <div className="bg-gray-200 px-2 py-2 shrink-0" style={{ paddingBottom: 'max(8px, env(safe-area-inset-bottom))' }}>
            <div className={`bg-white p-2 rounded-xl border border-gray-200 overflow-x-auto whitespace-nowrap shadow-lg ${isConveying || resultStatus !== null ? 'opacity-50 pointer-events-none' : ''}`}>
              <div className="flex gap-1.5 px-0.5">
                {SUSHI.map((s) => (
                  <button key={s.id} onClick={() => addSushi(s)}
                    className="flex flex-col items-center min-w-[64px] bg-gray-50 p-1 rounded-lg shadow-sm border border-gray-200 active:bg-red-50 active:scale-95 transition-all">
                    <div className="h-11 flex items-center justify-center pointer-events-none">
                      <Sprite name={s.id} h={42} />
                    </div>
                    <span className="text-[9px] text-gray-600 font-bold leading-none mt-0.5">{s.name}</span>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
