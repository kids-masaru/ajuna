<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さかなつり</title>
<link rel="stylesheet" href="assets/kit.css">
<style>
body {
  margin: 0; padding: 0;
  overflow: hidden;
  user-select: none;
  touch-action: none;
  overscroll-behavior: none;
  background: #0b3d5c;
  width: 100vw; height: 100dvh;
}
#game-container { width: 100vw; height: 100dvh; position: relative; }
#pond-canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  /* 左はホームボタン（position:fixed）ぶんだけ空ける */
  padding: max(14px, env(safe-area-inset-top)) 14px 8px 72px;
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.hud-box {
  background: rgba(255,255,255,0.92);
  border-radius: 999px; padding: 6px 16px;
  font-weight: 800; font-size: 1rem; color: #1f2937;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); white-space: nowrap;
}
.hud-box.warning { animation: hud-pulse 0.5s ease-in-out infinite alternate; color: #e11d48; }
@keyframes hud-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }

/* つった魚をならべる場所 */
#bucket {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-content: flex-end; gap: 2px;
  padding: 6px 10px max(6px, env(safe-area-inset-bottom)) 10px;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.35) 60%);
  pointer-events: none; min-height: 46px;
}
.bucket-fish { width: 34px; height: 30px; background-repeat: no-repeat; animation: pop-in 0.35s ease-out; }
@keyframes pop-in { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }

.screen-overlay {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 24px; text-align: center;
  background: linear-gradient(180deg, rgba(11,61,92,0.92), rgba(3,30,50,0.95));
  color: #fff;
}
.big-title { font-size: clamp(2rem, 9vw, 3rem); font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
.sub-text { font-size: 0.95rem; font-weight: 700; line-height: 1.7; color: rgba(255,255,255,0.9); }
#result-fish-row { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; margin: 14px 0 18px; max-width: 320px; }
.screen-overlay .gp-btn { white-space: nowrap; }
</style>
</head>
<body class="gp gp-cyan gp-dark">

<div id="game-container">
  <canvas id="pond-canvas"></canvas>

  <a href="index.html" class="gp-home" aria-label="ホーム">🏠</a>

  <div id="hud" style="display:none;">
    <div class="hud-box" id="score-display">🐟 0ひき</div>
    <div class="hud-box" id="timer-display">⏰ 60</div>
  </div>

  <div id="bucket" style="display:none;"></div>

  <div id="title-screen" class="screen-overlay">
    <div class="gp-hero gp-float">🎣</div>
    <h1 class="big-title">さかなつり</h1>
    <p class="sub-text">
      およいでいる おさかなを タッチ！<br>
      つりばりが とんでいって つれるよ<br>
      <span style="color:#fde047">⭐ほし と 💗ハート も とってね</span>
    </p>
    <button id="start-btn" class="gp-btn gp-btn--lg" style="margin-top:14px;">はじめる</button>
  </div>

  <div id="result-screen" class="screen-overlay" style="display:none;">
    <div class="gp-hero gp-float">🏆</div>
    <h2 class="big-title" id="result-title">つれた！</h2>
    <div style="font-size:1.1rem;font-weight:800;">スコア</div>
    <div id="final-score" style="font-size:3.2rem;font-weight:900;color:#fde047;line-height:1.1;">0</div>
    <div id="result-fish-row"></div>
    <div style="display:flex;gap:12px;">
      <a href="index.html" class="gp-btn gp-btn--ghost">🏠 もどる</a>
      <button id="retry-btn" class="gp-btn">もういっかい</button>
    </div>
  </div>
</div>

<script>
// ===== スプライトアトラス =====
const ATLAS_SRC = 'fish_atlas.png';
const ATLAS_W = 1400, ATLAS_H = 522;
const FRAMES = {"ripple":[0,0,395,204],"yellow_surprised":[399,0,108,106],"orange_surprised":[511,0,108,105],"yellow_smile":[623,0,126,103],"yellow_blink":[753,0,109,103],"orange_blink":[866,0,108,103],"red_smile":[978,0,123,102],"red_surprised":[1105,0,108,102],"yellow_sleepy":[1217,0,102,102],"yellow_angry":[0,208,121,102],"orange_smile":[125,208,122,102],"orange_sleepy":[251,208,103,102],"orange_angry":[358,208,122,102],"green_smile":[484,208,123,102],"green_blink":[611,208,105,102],"green_surprised":[720,208,107,102],"purple_smile":[831,208,123,102],"purple_surprised":[958,208,109,102],"purple_sleepy":[1071,208,101,102],"blue_smile":[1176,208,121,101],"blue_blink":[0,314,107,101],"blue_surprised":[111,314,106,101],"yellow_happy":[221,314,113,101],"purple_blink":[338,314,107,101],"purple_angry":[449,314,121,101],"red_sleepy":[574,314,98,100],"blue_sleepy":[676,314,105,100],"blue_angry":[785,314,121,100],"orange_happy":[910,314,110,100],"green_sleepy":[1024,314,101,100],"green_angry":[1129,314,121,100],"red_angry":[1254,314,125,99],"green_happy":[0,419,109,99],"red_blink":[113,419,105,98],"blue_happy":[222,419,110,98],"purple_happy":[336,419,109,98],"red_happy":[449,419,111,96],"spark":[564,419,83,73],"splash":[651,419,192,69],"heart":[847,419,63,63],"star":[914,419,61,59],"zzz":[979,419,57,59],"smoke":[1040,419,74,54]};

const COLORS = ['red', 'blue', 'yellow', 'orange', 'green', 'purple'];
const CSS_COLOR = { red:'#ef4444', blue:'#3b82f6', yellow:'#facc15', orange:'#fb923c', green:'#22c55e', purple:'#8b5cf6' };

const sheet = new Image();
let sheetReady = false;
sheet.onload = () => { sheetReady = true; };
sheet.onerror = () => { sheetReady = true; };
sheet.src = ATLAS_SRC;

// 高さ h にあわせて (cx,cy) を中心に描く。flip=true で左右反転（右向き）
function drawSprite(ctx, name, cx, cy, h, opt) {
  const f = FRAMES[name];
  if (!f) return;
  opt = opt || {};
  const w = f[2] * (h / f[3]);
  ctx.save();
  if (opt.alpha !== undefined) ctx.globalAlpha = opt.alpha;
  ctx.translate(cx, cy);
  if (opt.rot) ctx.rotate(opt.rot);
  if (opt.flip) ctx.scale(-1, 1);
  ctx.drawImage(sheet, f[0], f[1], f[2], f[3], -w / 2, -h / 2, w, h);
  ctx.restore();
}

const canvas = document.getElementById('pond-canvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const bucket = document.getElementById('bucket');
const scoreDisplay = document.getElementById('score-display');
const timerDisplay = document.getElementById('timer-display');
const titleScreen = document.getElementById('title-screen');
const resultScreen = document.getElementById('result-screen');
const finalScore = document.getElementById('final-score');
const resultFishRow = document.getElementById('result-fish-row');

// ===== 音 =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, toFreq) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(vol || 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol) {
  if (!audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = audioCtx.createBufferSource(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 900;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime);
  s.start();
}
const sndCast   = () => tone(320, 0.12, 'square', 0.1, 780);
const sndCatch  = () => { tone(660, 0.1, 'sine', 0.2); setTimeout(() => tone(880, 0.14, 'sine', 0.2), 90); noise(0.25, 0.16); };
const sndBonus  = () => { [784, 988, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'sine', 0.18), i * 80)); };
const sndMiss   = () => tone(200, 0.18, 'sawtooth', 0.1, 110);
const sndFanfare= () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.28, 'sine', 0.2), i * 150)); };

// ===== 画面サイズ =====
let W = 0, H = 0, waterTop = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  waterTop = Math.round(H * 0.20);
}
window.addEventListener('resize', resize);
resize();

// ===== ゲームの状態 =====
const GAME_TIME = 60;
let gameState = 'title';
let fishes = [], bubbles = [], effects = [], bonuses = [];
let hook = null;
let score = 0, timeLeft = GAME_TIME, caught = [];
let lastTime = 0, tRun = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ===== さかな =====
class Fish {
  constructor(opts) {
    opts = opts || {};
    this.color = pick(COLORS);
    // ねむっている魚はゆっくり、おこった魚ははやい
    const r = Math.random();
    this.kind = r < 0.18 ? 'sleepy' : (r < 0.34 ? 'angry' : 'normal');
    this.h = this.kind === 'angry' ? rnd(52, 62) : rnd(58, 74);
    const speed = this.kind === 'sleepy' ? rnd(14, 26)
                : this.kind === 'angry' ? rnd(120, 165) : rnd(45, 80);
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.vx = speed * this.dir;
    this.y = rnd(waterTop + this.h * 0.7, H - this.h * 0.8 - 40);
    this.x = opts.fromEdge
      ? (this.dir > 0 ? -this.h : W + this.h)
      : rnd(this.h, W - this.h);
    this.bobPhase = Math.random() * Math.PI * 2;
    this.bobAmp = rnd(4, 11);
    this.bobSpeed = rnd(1.4, 2.6);
    this.blinkAt = rnd(1.5, 5);
    this.blinkT = 0;
    this.caught = false;
    this.dead = false;
    this.bubbleAt = rnd(0.8, 3);
  }
  get spriteName() {
    if (this.caught) return this.color + '_surprised';
    if (this.kind === 'sleepy') return this.color + '_sleepy';
    if (this.kind === 'angry') return this.color + '_angry';
    if (this.blinkT > 0) return this.color + (this.blinkT > 0.12 ? '_blink' : '_happy');
    return this.color + '_smile';
  }
  update(dt) {
    if (this.caught) {
      // つられて水面へあがっていく
      this.y -= 420 * dt;
      this.x += (this.catchTargetX - this.x) * Math.min(1, dt * 6);
      if (this.y < waterTop - 60) this.dead = true;
      return;
    }
    this.x += this.vx * dt;
    this.bobPhase += this.bobSpeed * dt;
    this.blinkAt -= dt;
    if (this.blinkAt <= 0) { this.blinkT = 0.24; this.blinkAt = rnd(2, 6); }
    if (this.blinkT > 0) this.blinkT -= dt;
    // 画面のはしまで行ったら反対から出てくる
    const m = this.h;
    if (this.vx > 0 && this.x > W + m) { this.x = -m; this.y = rnd(waterTop + m * 0.7, H - m * 0.8 - 40); }
    if (this.vx < 0 && this.x < -m) { this.x = W + m; this.y = rnd(waterTop + m * 0.7, H - m * 0.8 - 40); }
    // ときどき あわ を出す
    this.bubbleAt -= dt;
    if (this.bubbleAt <= 0) {
      this.bubbleAt = rnd(1.4, 4);
      bubbles.push({ x: this.x - this.dir * this.h * 0.35, y: this.drawY, r: rnd(3, 7), vy: rnd(22, 42), life: 1, wob: Math.random() * 6 });
    }
  }
  get drawY() { return this.y + Math.sin(this.bobPhase) * this.bobAmp; }
  draw(ctx) {
    const y = this.drawY;
    // 進む向きに少しかたむける
    const rot = Math.sin(this.bobPhase) * 0.07 * (this.dir > 0 ? -1 : 1);
    if (this.kind === 'sleepy' && !this.caught) {
      const t = (tRun * 0.6) % 1;
      drawSprite(ctx, 'zzz', this.x + this.h * 0.35, y - this.h * 0.55 - t * 22, 20 + t * 8, { alpha: 0.9 * (1 - t) });
    }
    drawSprite(ctx, this.spriteName, this.x, y, this.h, { flip: this.dir > 0, rot: rot });
  }
  hit(px, py) {
    const dx = (px - this.x) / (this.h * 0.62);
    const dy = (py - this.drawY) / (this.h * 0.52);
    return dx * dx + dy * dy <= 1;
  }
}

// ===== ボーナス（ほし・ハート）=====
class Bonus {
  constructor() {
    this.type = Math.random() < 0.6 ? 'star' : 'heart';
    this.h = 40;
    this.x = rnd(40, W - 40);
    this.y = H + 40;
    this.vy = -rnd(34, 52);
    this.phase = Math.random() * 6.28;
    this.dead = false;
    this.caught = false;
  }
  update(dt) {
    this.y += this.vy * dt;
    this.phase += dt * 2;
    this.x += Math.sin(this.phase) * 14 * dt;
    if (this.y < waterTop - 30) this.dead = true;
  }
  draw(ctx) {
    drawSprite(ctx, this.type, this.x, this.y, this.h, { rot: Math.sin(this.phase) * 0.25 });
  }
  hit(px, py) {
    const d = Math.hypot(px - this.x, py - this.y);
    return d < this.h * 0.8;
  }
}

// ===== つりばり =====
function castHook(tx, ty, onArrive) {
  hook = { x: tx, y: waterTop - 30, tx: tx, ty: ty, t: 0, onArrive: onArrive, back: false, holdY: 0 };
  sndCast();
}
function updateHook(dt) {
  if (!hook) return;
  hook.t += dt;
  if (!hook.back) {
    hook.y += (hook.ty - hook.y) * Math.min(1, dt * 14);
    if (Math.abs(hook.ty - hook.y) < 6 || hook.t > 0.6) {
      hook.back = true;
      if (hook.onArrive) hook.onArrive();
    }
  } else {
    hook.y -= 620 * dt;
    if (hook.y < waterTop - 40) hook = null;
  }
}
function drawHook(ctx) {
  if (!hook) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hook.x, waterTop - 40); ctx.lineTo(hook.x, hook.y); ctx.stroke();
  // はり
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hook.x, hook.y + 5, 6, Math.PI * 0.15, Math.PI * 1.25); ctx.stroke();
  ctx.restore();
}

// ===== エフェクト =====
function addEffect(name, x, y, h, life, opt) {
  effects.push(Object.assign({ name, x, y, h, life, max: life }, opt || {}));
}
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i];
    e.life -= dt;
    if (e.vy) e.y += e.vy * dt;
    if (e.life <= 0) effects.splice(i, 1);
  }
}
function drawEffects(ctx) {
  for (const e of effects) {
    const k = e.life / e.max;
    drawSprite(ctx, e.name, e.x, e.y, e.h * (e.grow ? (1.6 - k * 0.6) : 1), { alpha: Math.min(1, k * 1.6) });
  }
}
// 「+1」などの文字
let floats = [];
function addFloat(x, y, text, color) { floats.push({ x, y, text, color, life: 1 }); }
function updateFloats(dt) {
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.life -= dt * 1.3; f.y -= 40 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}
function drawFloats(ctx) {
  ctx.save();
  ctx.textAlign = 'center'; ctx.font = '900 24px sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}

// ===== あわ =====
function updateBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt; b.wob += dt * 3;
    b.x += Math.sin(b.wob) * 12 * dt;
    if (b.y < waterTop) { bubbles.splice(i, 1); continue; }
  }
  if (Math.random() < dt * 3) {
    bubbles.push({ x: rnd(0, W), y: H - 10, r: rnd(2, 6), vy: rnd(18, 38), wob: Math.random() * 6 });
  }
}
function drawBubbles(ctx) {
  ctx.save();
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fill();
    ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.stroke();
  }
  ctx.restore();
}

// ===== 背景 =====
let waveT = 0;
function drawScene(ctx) {
  // そら
  const sky = ctx.createLinearGradient(0, 0, 0, waterTop);
  sky.addColorStop(0, '#7dd3fc'); sky.addColorStop(1, '#e0f2fe');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, waterTop);
  // みず
  const water = ctx.createLinearGradient(0, waterTop, 0, H);
  water.addColorStop(0, '#38bdf8'); water.addColorStop(0.5, '#0284c7'); water.addColorStop(1, '#0c4a6e');
  ctx.fillStyle = water; ctx.fillRect(0, waterTop, W, H - waterTop);
  // 光のすじ
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) {
    const x = (i + 0.5) * W / 5 + Math.sin(waveT * 0.4 + i) * 18;
    ctx.beginPath(); ctx.moveTo(x - 22, waterTop); ctx.lineTo(x + 22, waterTop);
    ctx.lineTo(x + 70, H); ctx.lineTo(x - 70, H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // なみ
  ctx.save(); ctx.fillStyle = '#bae6fd'; ctx.beginPath();
  ctx.moveTo(0, waterTop);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, waterTop + Math.sin(x * 0.03 + waveT * 2) * 4);
  ctx.lineTo(W, waterTop + 8); ctx.lineTo(0, waterTop + 8); ctx.closePath(); ctx.fill();
  ctx.restore();
  // すなの底
  ctx.save(); ctx.fillStyle = '#fde68a'; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 18 - Math.sin(x * 0.02) * 8);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
}

// ===== タップ =====
function onTap(px, py) {
  if (gameState !== 'playing' || hook) return;
  // ボーナスを先に判定（小さいので取りやすく）
  for (const b of bonuses) {
    if (!b.caught && b.hit(px, py)) {
      b.caught = true;
      castHook(b.x, b.y, () => {
        b.dead = true;
        if (b.type === 'star') { score += 5; addFloat(b.x, b.y, '+5', '#fde047'); }
        else { timeLeft = Math.min(GAME_TIME, timeLeft + 5); addFloat(b.x, b.y, '+5びょう', '#fb7185'); }
        addEffect('spark', b.x, b.y, 70, 0.5, { grow: true });
        sndBonus(); updateHUD();
      });
      return;
    }
  }
  let target = null, best = Infinity;
  for (const f of fishes) {
    if (f.caught) continue;
    const d = Math.hypot(px - f.x, py - f.drawY);
    if (f.hit(px, py) && d < best) { best = d; target = f; }
  }
  if (!target) { sndMiss(); addEffect('smoke', px, py, 40, 0.35); return; }
  const tx = target.x, ty = target.drawY;
  castHook(tx, ty, () => {
    // はりが着いたとき、まだ近くにいれば つれる
    const d = Math.hypot(hook.x - target.x, hook.y - target.drawY);
    if (target.caught || d > target.h * 1.1) { sndMiss(); return; }
    target.caught = true;
    target.catchTargetX = hook.x;
    score += target.kind === 'angry' ? 3 : 1;
    caught.push(target.color);
    addFloat(target.x, target.drawY - 26, target.kind === 'angry' ? '+3' : '+1', '#fff');
    addEffect('splash', target.x, target.drawY, 70, 0.45);
    addEffect('spark', target.x, target.drawY, 60, 0.4, { grow: true });
    sndCatch();
    addBucketFish(target.color);
    updateHUD();
    setTimeout(() => fishes.push(new Fish({ fromEdge: true })), 900);
  });
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); ensureAudio();
  const r = canvas.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});

function addBucketFish(color) {
  const d = document.createElement('div');
  d.className = 'bucket-fish';
  const f = FRAMES[color + '_smile'];
  const s = 30 / f[3];
  d.style.width = (f[2] * s) + 'px';
  d.style.backgroundImage = `url(${ATLAS_SRC})`;
  d.style.backgroundSize = `${ATLAS_W * s}px ${ATLAS_H * s}px`;
  d.style.backgroundPosition = `-${f[0] * s}px -${f[1] * s}px`;
  bucket.appendChild(d);
}
function updateHUD() {
  scoreDisplay.textContent = '🐟 ' + score + 'ひき';
  timerDisplay.textContent = '⏰ ' + Math.ceil(timeLeft);
  timerDisplay.classList.toggle('warning', timeLeft <= 10);
}

// ===== メインループ =====
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts; tRun += dt; waveT += dt;

  drawScene(ctx);

  if (gameState === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    updateHUD();

    fishes.forEach(f => f.update(dt));
    fishes = fishes.filter(f => !f.dead);
    bonuses.forEach(b => b.update(dt));
    bonuses = bonuses.filter(b => !b.dead);
    if (Math.random() < dt * 0.22 && bonuses.length < 2) bonuses.push(new Bonus());
    updateHook(dt);
  }
  updateBubbles(dt); updateEffects(dt); updateFloats(dt);

  drawBubbles(ctx);
  fishes.forEach(f => f.draw(ctx));
  bonuses.forEach(b => b.draw(ctx));
  drawHook(ctx);
  drawEffects(ctx);
  drawFloats(ctx);

  requestAnimationFrame(loop);
}

function startGame() {
  ensureAudio();
  score = 0; timeLeft = GAME_TIME; caught = [];
  fishes = []; bubbles = []; effects = []; bonuses = []; floats = []; hook = null;
  for (let i = 0; i < 9; i++) fishes.push(new Fish());
  bucket.innerHTML = '';
  bucket.style.display = 'flex';
  hud.style.display = 'flex';
  titleScreen.style.display = 'none';
  resultScreen.style.display = 'none';
  updateHUD();
  gameState = 'playing';
}
function endGame() {
  gameState = 'result';
  hook = null;
  finalScore.textContent = score;
  document.getElementById('result-title').textContent =
    score >= 30 ? 'つりめいじん！' : score >= 15 ? 'じょうず！' : 'つれた！';
  resultFishRow.innerHTML = '';
  caught.slice(0, 24).forEach(c => {
    const d = document.createElement('div');
    const f = FRAMES[c + '_happy']; const s = 26 / f[3];
    d.style.cssText = `width:${f[2]*s}px;height:26px;background-image:url(${ATLAS_SRC});background-size:${ATLAS_W*s}px ${ATLAS_H*s}px;background-position:-${f[0]*s}px -${f[1]*s}px;background-repeat:no-repeat;`;
    resultFishRow.appendChild(d);
  });
  resultScreen.style.display = 'flex';
  hud.style.display = 'none';
  bucket.style.display = 'none';
  sndFanfare();
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.addEventListener('contextmenu', e => e.preventDefault());

// 画像が読めてからタイトルのボタンを押せるように
const startBtn = document.getElementById('start-btn');
startBtn.disabled = true; startBtn.textContent = 'よみこみちゅう…';
const waitReady = setInterval(() => {
  if (sheetReady) {
    clearInterval(waitReady);
    startBtn.disabled = false; startBtn.textContent = 'はじめる';
  }
}, 60);

requestAnimationFrame(loop);
</script>
</body>
