<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さかなつり</title>
<link rel="stylesheet" href="assets/kit.css">
<style>
body {
  margin: 0; padding: 0; overflow: hidden;
  user-select: none; touch-action: none; overscroll-behavior: none;
  background: #0b3d5c; width: 100vw; height: 100dvh;
}
#game-container { width: 100vw; height: 100dvh; position: relative; }
#pond-canvas { display: block; width: 100%; height: 100%; }

#hud {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  padding: max(14px, env(safe-area-inset-top)) 12px 6px 72px;
  pointer-events: none;
}
.hud-box {
  background: rgba(255,255,255,0.92); border-radius: 999px;
  padding: 5px 14px; font-weight: 800; font-size: 0.95rem; color: #1f2937;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2); white-space: nowrap;
}
.hud-box.warning { animation: hud-pulse 0.5s ease-in-out infinite alternate; color: #e11d48; }
@keyframes hud-pulse { from { transform: scale(1); } to { transform: scale(1.12); } }

/* お題（この色のさかなをつって！） */
#order-bar {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc(max(14px, env(safe-area-inset-top)) + 42px);
  z-index: 10; display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.95); border-radius: 999px;
  padding: 5px 16px 5px 8px; box-shadow: 0 3px 10px rgba(0,0,0,0.25);
  pointer-events: none;
}
#order-fish { width: 46px; height: 40px; background-repeat: no-repeat; }
/* 画面がせまくても1行におさまるように */
#order-text { font-weight: 900; font-size: clamp(0.7rem, 3.3vw, 0.95rem); color: #1f2937; white-space: nowrap; }
#combo-badge {
  font-weight: 900; font-size: 0.85rem; color: #fff; background: #f97316;
  border-radius: 999px; padding: 2px 10px; display: none;
}
#order-bar.flash { animation: order-flash 0.45s ease-out; }
@keyframes order-flash { 0% { transform: translateX(-50%) scale(1.3); background: #fef08a; } 100% { transform: translateX(-50%) scale(1); background: rgba(255,255,255,0.95); } }

#bucket {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-content: flex-end; gap: 2px;
  padding: 5px 10px max(5px, env(safe-area-inset-bottom)) 10px;
  background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 60%);
  pointer-events: none; min-height: 38px;
}
.bucket-fish { height: 26px; background-repeat: no-repeat; animation: pop-in 0.35s ease-out; }
@keyframes pop-in { 0% { transform: scale(0.2); opacity: 0; } 70% { transform: scale(1.25); } 100% { transform: scale(1); opacity: 1; } }

.screen-overlay {
  position: absolute; inset: 0; z-index: 50;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding: 24px; text-align: center;
  background: linear-gradient(180deg, rgba(11,61,92,0.93), rgba(3,30,50,0.96)); color: #fff;
}
.big-title { font-size: clamp(2rem, 9vw, 3rem); font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,0.5); }
.sub-text { font-size: 0.95rem; font-weight: 700; line-height: 1.7; color: rgba(255,255,255,0.9); }
#result-fish-row { display: flex; justify-content: center; gap: 3px; flex-wrap: wrap; margin: 12px 0 16px; max-width: 320px; }
.screen-overlay .gp-btn { white-space: nowrap; }
</style>
</head>
<body class="gp gp-cyan gp-dark">

<div id="game-container">
  <canvas id="pond-canvas"></canvas>
  <a href="index.html" class="gp-home" aria-label="ホーム">🏠</a>

  <div id="hud" style="display:none;">
    <div class="hud-box" id="score-display">⭐ 0</div>
    <div class="hud-box" id="timer-display">⏰ 60</div>
  </div>

  <div id="order-bar" style="display:none;">
    <div id="order-fish"></div>
    <div id="order-text">を つって！</div>
    <div id="combo-badge">れんぞく 2</div>
  </div>

  <div id="bucket" style="display:none;"></div>

  <div id="title-screen" class="screen-overlay">
    <div class="gp-hero gp-float">🎣</div>
    <h1 class="big-title">さかなつり</h1>
    <p class="sub-text">
      うえに でている いろの<br>
      おさかなを タッチして つろう！<br>
      <span style="color:#fde047">⭐ほし と 💗ハート も とってね</span>
    </p>
    <div class="sub-text" style="margin-top:14px;opacity:0.8">よみこみちゅう…</div>
  </div>

  <div id="result-screen" class="screen-overlay" style="display:none;">
    <div class="gp-hero gp-float">🏆</div>
    <h2 class="big-title" id="result-title">つれた！</h2>
    <div style="font-size:1.05rem;font-weight:800;">スコア</div>
    <div id="final-score" style="font-size:3.2rem;font-weight:900;color:#fde047;line-height:1.1;">0</div>
    <div id="result-fish-row"></div>
    <div style="display:flex;gap:12px;">
      <a href="index.html" class="gp-btn gp-btn--ghost">🏠 もどる</a>
      <button id="retry-btn" class="gp-btn">もういっかい</button>
    </div>
  </div>
</div>

<script>
// ===== スプライトアトラス =====
const ATLAS_SRC = 'fish_atlas.png';
const ATLAS_W = 1400, ATLAS_H = 504;
const FRAMES = {"green_smile":[0,0,145,129],"purple_smile":[149,0,145,128],"blue_smile":[298,0,145,124],"orange_smile":[447,0,146,124],"red_smile":[597,0,145,122],"yellow_smile":[746,0,140,121],"orange_blink":[890,0,98,103],"orange_surprised":[992,0,96,103],"green_surprised":[1092,0,96,103],"yellow_blink":[1192,0,98,102],"yellow_surprised":[1294,0,96,102],"green_blink":[0,133,98,102],"green_angry":[102,133,106,102],"blue_blink":[212,133,98,101],"orange_angry":[314,133,106,101],"whirl":[424,133,98,101],"blue_angry":[526,133,107,100],"purple_blink":[637,133,96,100],"purple_surprised":[737,133,96,100],"purple_angry":[837,133,103,99],"red_blink":[944,133,98,98],"blue_surprised":[1046,133,94,98],"yellow_angry":[1144,133,107,98],"red_surprised":[1255,133,95,96],"orange_swim0":[0,239,121,96],"blue_happy":[125,239,94,95],"orange_happy":[223,239,91,95],"green_happy":[318,239,93,95],"purple_swim0":[415,239,121,95],"yellow_happy":[540,239,92,94],"yellow_swim0":[636,239,121,94],"purple_happy":[761,239,92,94],"red_angry":[857,239,104,93],"blue_swim0":[965,239,120,93],"green_swim0":[1089,239,120,93],"red_happy":[1213,239,93,90],"yellow_sleepy":[0,339,90,90],"blue_sleepy":[94,339,89,89],"orange_sleepy":[187,339,89,89],"green_sleepy":[280,339,88,89],"purple_sleepy":[372,339,89,89],"red_swim0":[465,339,118,87],"red_sleepy":[587,339,88,85],"orange_swim1":[679,339,90,80],"purple_swim1":[773,339,89,80],"yellow_swim1":[866,339,89,79],"green_swim1":[959,339,89,79],"red_swim1":[1052,339,86,78],"blue_swim1":[1142,339,88,77],"star":[1234,339,77,74],"heart":[1315,339,77,74],"splash":[0,433,125,67],"smoke":[129,433,67,67],"splash_s":[200,433,139,65],"zzz":[343,433,53,60],"excl":[400,433,26,59],"bubble":[430,433,56,58],"spark":[490,433,70,58]};

const COLORS = ['red', 'blue', 'yellow', 'orange', 'green', 'purple'];
const COLOR_JA = { red:'あかい', blue:'あおい', yellow:'きいろい', orange:'オレンジの', green:'みどりの', purple:'むらさきの' };

const sheet = new Image();
let sheetReady = false;
sheet.onload = () => { sheetReady = true; };
sheet.onerror = () => { sheetReady = true; };
sheet.src = ATLAS_SRC;

function drawSprite(ctx, name, cx, cy, h, opt) {
  const f = FRAMES[name];
  if (!f) return;
  opt = opt || {};
  const w = f[2] * (h / f[3]);
  ctx.save();
  if (opt.alpha !== undefined) ctx.globalAlpha = opt.alpha;
  ctx.translate(cx, cy);
  if (opt.rot) ctx.rotate(opt.rot);
  if (opt.flip) ctx.scale(-1, 1);
  ctx.drawImage(sheet, f[0], f[1], f[2], f[3], -w / 2, -h / 2, w, h);
  ctx.restore();
}
function spriteCss(name, h) {
  const f = FRAMES[name], s = h / f[3];
  return `width:${(f[2]*s).toFixed(1)}px;height:${h}px;background-image:url(${ATLAS_SRC});`
       + `background-size:${(ATLAS_W*s).toFixed(1)}px ${(ATLAS_H*s).toFixed(1)}px;`
       + `background-position:-${(f[0]*s).toFixed(1)}px -${(f[1]*s).toFixed(1)}px;background-repeat:no-repeat;`;
}

const canvas = document.getElementById('pond-canvas');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const bucket = document.getElementById('bucket');
const orderBar = document.getElementById('order-bar');
const orderFish = document.getElementById('order-fish');
const orderText = document.getElementById('order-text');
const comboBadge = document.getElementById('combo-badge');
const scoreDisplay = document.getElementById('score-display');
const timerDisplay = document.getElementById('timer-display');
const titleScreen = document.getElementById('title-screen');
const resultScreen = document.getElementById('result-screen');
const finalScore = document.getElementById('final-score');
const resultFishRow = document.getElementById('result-fish-row');

// ===== 音 =====
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, toFreq) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  const t = audioCtx.currentTime;
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (toFreq) o.frequency.exponentialRampToValueAtTime(toFreq, t + dur);
  g.gain.setValueAtTime(vol || 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol) {
  if (!audioCtx) return;
  const len = Math.floor(audioCtx.sampleRate * dur);
  const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = audioCtx.createBufferSource(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
  f.type = 'highpass'; f.frequency.value = 900;
  s.buffer = buf; s.connect(f); f.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(vol || 0.2, audioCtx.currentTime); s.start();
}
const sndCast  = () => tone(340, 0.1, 'square', 0.08, 760);
const sndGood  = () => { tone(660, 0.1, 'sine', 0.2); setTimeout(() => tone(990, 0.16, 'sine', 0.2), 90); noise(0.22, 0.14); };
const sndWrong = () => { tone(300, 0.16, 'sawtooth', 0.1, 160); };
const sndBonus = () => [784, 988, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.14, 'sine', 0.18), i * 80));
const sndMiss  = () => tone(200, 0.14, 'sine', 0.07, 130);
const sndFan   = () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.28, 'sine', 0.2), i * 150));

// ===== 画面 =====
let W = 0, H = 0, waterTop = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  waterTop = Math.round(H * 0.22);
}
window.addEventListener('resize', resize);
resize();

const GAME_TIME = 60;
let gameState = 'title';
let fishes = [], bubbles = [], effects = [], bonuses = [], floats = [];
let hook = null;
let score = 0, timeLeft = GAME_TIME, caught = [], combo = 0;
let orderColor = 'red';
let lastTime = 0, tRun = 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ===== さかな =====
class Fish {
  constructor(opts) {
    opts = opts || {};
    this.color = opts.color || pick(COLORS);
    const r = Math.random();
    this.kind = r < 0.15 ? 'sleepy' : (r < 0.3 ? 'quick' : 'normal');
    this.h = this.kind === 'quick' ? rnd(34, 40) : rnd(38, 50);   // まえより小さめ
    this.baseSpeed = this.kind === 'sleepy' ? rnd(10, 20)
                   : this.kind === 'quick' ? rnd(85, 115) : rnd(38, 62);
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.y = rnd(waterTop + this.h, H - this.h - 46);
    this.x = opts.fromEdge ? (this.dir > 0 ? -this.h : W + this.h) : rnd(this.h, W - this.h);
    this.bobPhase = Math.random() * 6.28;
    this.bobAmp = rnd(3, 9);
    this.bobSpeed = rnd(1.5, 2.8);
    this.swimPhase = Math.random() * 6.28;
    // 表情アニメ
    this.face = 'smile';
    this.faceT = rnd(0.8, 2.6);
    // 方向転換
    this.turnT = rnd(2.5, 6);
    this.turning = 0;
    this.scared = 0;      // はりが近いとおどろく
    this.escape = 0;      // まちがえて釣られたときに逃げる
    this.caught = false;
    this.dead = false;
    this.bubbleT = rnd(0.8, 3);
  }
  get speed() {
    if (this.escape > 0) return this.baseSpeed * 3.2;
    if (this.turning > 0) return this.baseSpeed * 0.15;
    return this.baseSpeed;
  }
  get sprite() {
    if (this.caught) return this.color + '_surprised';
    if (this.escape > 0) return this.color + '_angry';
    if (this.scared > 0) return this.color + '_surprised';
    if (this.kind === 'sleepy') return this.color + '_sleepy';
    // はやい魚は泳ぎの絵を交互に使ってパタパタさせる
    if (this.kind === 'quick') return this.color + (Math.floor(this.swimPhase * 3) % 2 ? '_swim1' : '_swim0');
    return this.color + '_' + this.face;
  }
  update(dt) {
    if (this.caught) {
      this.y -= 400 * dt;
      this.x += (this.catchX - this.x) * Math.min(1, dt * 6);
      if (this.y < waterTop - 60) this.dead = true;
      return;
    }
    this.swimPhase += dt * 2;
    this.bobPhase += this.bobSpeed * dt;
    if (this.scared > 0) this.scared -= dt;
    if (this.escape > 0) this.escape -= dt;

    // 表情をときどき変える（ぱちぱち・にっこり）
    this.faceT -= dt;
    if (this.faceT <= 0) {
      if (this.face === 'smile') {
        this.face = Math.random() < 0.6 ? 'blink' : 'happy';
        this.faceT = this.face === 'blink' ? 0.18 : rnd(0.5, 1.0);
      } else { this.face = 'smile'; this.faceT = rnd(1.2, 3.4); }
    }
    // ときどき くるっと むきを変える
    if (this.kind !== 'sleepy' && this.escape <= 0) {
      this.turnT -= dt;
      if (this.turnT <= 0 && this.turning <= 0) { this.turning = 0.45; this.turnT = rnd(3, 7); }
    }
    if (this.turning > 0) {
      const before = this.turning;
      this.turning -= dt;
      if (before > 0.225 && this.turning <= 0.225) this.dir *= -1;   // 半分すぎたら反転
    }
    this.x += this.speed * this.dir * dt;
    const m = this.h;
    if (this.x > W + m) { this.dir = -1; this.x = W + m; }
    if (this.x < -m) { this.dir = 1; this.x = -m; }
    // あわ
    this.bubbleT -= dt;
    if (this.bubbleT <= 0) {
      this.bubbleT = rnd(1.5, 4.5);
      bubbles.push({ x: this.x - this.dir * this.h * 0.3, y: this.drawY, r: rnd(2.5, 6), vy: rnd(20, 40), wob: Math.random() * 6 });
    }
  }
  get drawY() { return this.y + Math.sin(this.bobPhase) * this.bobAmp; }
  draw(ctx) {
    const y = this.drawY;
    // むきを変えるあいだは横につぶれて、くるっと回って見える
    const sq = this.turning > 0 ? Math.abs(Math.cos((0.45 - this.turning) / 0.45 * Math.PI)) : 1;
    const rot = Math.sin(this.bobPhase) * 0.08 * (this.dir > 0 ? -1 : 1);
    if (this.kind === 'sleepy' && !this.caught) {
      const t = (tRun * 0.5 + this.bobPhase * 0.1) % 1;
      drawSprite(ctx, 'zzz', this.x + this.h * 0.4, y - this.h * 0.6 - t * 20, 16 + t * 7, { alpha: 0.9 * (1 - t) });
    }
    if (this.escape > 0) drawSprite(ctx, 'excl', this.x, y - this.h * 0.75, 20, { alpha: Math.min(1, this.escape * 3) });
    ctx.save();
    ctx.translate(this.x, y); ctx.scale(Math.max(0.08, sq), 1); ctx.translate(-this.x, -y);
    drawSprite(ctx, this.sprite, this.x, y, this.h, { flip: this.dir > 0, rot: rot });
    ctx.restore();
  }
  hit(px, py) {
    const dx = (px - this.x) / (this.h * 0.72);
    const dy = (py - this.drawY) / (this.h * 0.62);
    return dx * dx + dy * dy <= 1;
  }
}

class Bonus {
  constructor() {
    this.type = Math.random() < 0.62 ? 'star' : 'heart';
    this.h = 34;
    this.x = rnd(40, W - 40); this.y = H + 30;
    this.vy = -rnd(30, 48);
    this.phase = Math.random() * 6.28;
    this.dead = false; this.taken = false;
  }
  update(dt) {
    this.y += this.vy * dt; this.phase += dt * 2;
    this.x += Math.sin(this.phase) * 14 * dt;
    if (this.y < waterTop - 30) this.dead = true;
  }
  draw(ctx) { drawSprite(ctx, this.type, this.x, this.y, this.h, { rot: Math.sin(this.phase) * 0.25 }); }
  hit(px, py) { return Math.hypot(px - this.x, py - this.y) < this.h * 0.9; }
}

// ===== つりばり =====
function castHook(tx, ty, onArrive) {
  hook = { x: tx, y: waterTop - 30, ty: ty, t: 0, onArrive: onArrive, back: false };
  sndCast();
}
function updateHook(dt) {
  if (!hook) return;
  hook.t += dt;
  if (!hook.back) {
    hook.y += (hook.ty - hook.y) * Math.min(1, dt * 11);
    // はりが近づくと魚がおどろく
    for (const f of fishes) {
      if (!f.caught && Math.hypot(f.x - hook.x, f.drawY - hook.y) < f.h * 2.2) f.scared = 0.35;
    }
    if (Math.abs(hook.ty - hook.y) < 7 || hook.t > 0.75) {
      hook.back = true;
      if (hook.onArrive) hook.onArrive();
    }
  } else {
    hook.y -= 600 * dt;
    if (hook.y < waterTop - 40) hook = null;
  }
}
function drawHook(ctx) {
  if (!hook) return;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(hook.x, waterTop - 40); ctx.lineTo(hook.x, hook.y); ctx.stroke();
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(hook.x, hook.y + 5, 6, Math.PI * 0.15, Math.PI * 1.25); ctx.stroke();
  ctx.restore();
}

// ===== エフェクト =====
function addEffect(name, x, y, h, life, opt) { effects.push(Object.assign({ name, x, y, h, life, max: life }, opt || {})); }
function addFloat(x, y, text, color) { floats.push({ x, y, text, color, life: 1 }); }
function updateEffects(dt) {
  for (let i = effects.length - 1; i >= 0; i--) {
    const e = effects[i]; e.life -= dt;
    if (e.vy) e.y += e.vy * dt;
    if (e.life <= 0) effects.splice(i, 1);
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i]; f.life -= dt * 1.25; f.y -= 42 * dt;
    if (f.life <= 0) floats.splice(i, 1);
  }
}
function drawEffects(ctx) {
  for (const e of effects) {
    const k = e.life / e.max;
    drawSprite(ctx, e.name, e.x, e.y, e.h * (e.grow ? (1.7 - k * 0.7) : 1), { alpha: Math.min(1, k * 1.6), rot: e.rot || 0 });
  }
  ctx.save(); ctx.textAlign = 'center'; ctx.font = '900 24px sans-serif';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, f.life * 1.5);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.restore();
}
function updateBubbles(dt) {
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i]; b.y -= b.vy * dt; b.wob += dt * 3;
    b.x += Math.sin(b.wob) * 12 * dt;
    if (b.y < waterTop) bubbles.splice(i, 1);
  }
  if (Math.random() < dt * 2.5) bubbles.push({ x: rnd(0, W), y: H - 10, r: rnd(2, 5), vy: rnd(18, 36), wob: Math.random() * 6 });
}
function drawBubbles(ctx) {
  ctx.save();
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(255,255,255,0.16)'; ctx.fill();
    ctx.lineWidth = 1.1; ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.stroke();
  }
  ctx.restore();
}

// ===== 背景 =====
let waveT = 0;
function drawScene(ctx) {
  const sky = ctx.createLinearGradient(0, 0, 0, waterTop);
  sky.addColorStop(0, '#7dd3fc'); sky.addColorStop(1, '#e0f2fe');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, waterTop);
  const water = ctx.createLinearGradient(0, waterTop, 0, H);
  water.addColorStop(0, '#38bdf8'); water.addColorStop(0.5, '#0284c7'); water.addColorStop(1, '#0c4a6e');
  ctx.fillStyle = water; ctx.fillRect(0, waterTop, W, H - waterTop);
  ctx.save(); ctx.globalAlpha = 0.10; ctx.fillStyle = '#fff';
  for (let i = 0; i < 5; i++) {
    const x = (i + 0.5) * W / 5 + Math.sin(waveT * 0.4 + i) * 18;
    ctx.beginPath(); ctx.moveTo(x - 22, waterTop); ctx.lineTo(x + 22, waterTop);
    ctx.lineTo(x + 70, H); ctx.lineTo(x - 70, H); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  ctx.save(); ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.moveTo(0, waterTop);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, waterTop + Math.sin(x * 0.03 + waveT * 2) * 4);
  ctx.lineTo(W, waterTop + 8); ctx.lineTo(0, waterTop + 8); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.save(); ctx.fillStyle = '#fde68a'; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, H - 16 - Math.sin(x * 0.02) * 7);
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill(); ctx.restore();
}

// ===== お題 =====
function newOrder() {
  // 泳いでいる色の中からえらぶ（いない色を出さない）
  const alive = [...new Set(fishes.filter(f => !f.caught).map(f => f.color))];
  const poolAll = alive.length ? alive : COLORS;
  const pool = poolAll.length > 1 ? poolAll.filter(c => c !== orderColor) : poolAll;
  orderColor = pick(pool.length ? pool : poolAll);
  orderFish.style.cssText = spriteCss(orderColor + '_smile', 40);
  orderText.textContent = COLOR_JA[orderColor] + 'さかな を つって！';
  orderBar.classList.remove('flash'); void orderBar.offsetWidth; orderBar.classList.add('flash');
}
function updateCombo() {
  if (combo >= 2) { comboBadge.style.display = ''; comboBadge.textContent = 'れんぞく ' + combo; }
  else comboBadge.style.display = 'none';
}

// ===== タップ =====
function onTap(px, py) {
  if (gameState !== 'playing' || hook) return;
  for (const b of bonuses) {
    if (!b.taken && b.hit(px, py)) {
      b.taken = true;
      castHook(b.x, b.y, () => {
        b.dead = true;
        if (b.type === 'star') { score += 5; addFloat(b.x, b.y, '+5', '#fde047'); }
        else { timeLeft = Math.min(GAME_TIME, timeLeft + 5); addFloat(b.x, b.y, '+5びょう', '#fb7185'); }
        addEffect('spark', b.x, b.y, 60, 0.5, { grow: true });
        sndBonus(); updateHUD();
      });
      return;
    }
  }
  let target = null, best = Infinity;
  for (const f of fishes) {
    if (f.caught) continue;
    const d = Math.hypot(px - f.x, py - f.drawY);
    if (f.hit(px, py) && d < best) { best = d; target = f; }
  }
  if (!target) { sndMiss(); addEffect('smoke', px, py, 34, 0.3); return; }

  castHook(target.x, target.drawY, () => {
    // はりが着いたとき、まだ近くにいれば つれる
    if (target.caught || Math.hypot(hook.x - target.x, hook.y - target.drawY) > target.h * 1.25) {
      sndMiss(); return;
    }
    if (target.color === orderColor) {
      target.caught = true; target.catchX = hook.x;
      combo++;
      const pts = 2 + Math.min(combo - 1, 4);   // れんぞくで だんだん高得点
      score += pts;
      caught.push(target.color);
      addFloat(target.x, target.drawY - 24, '+' + pts, '#fff');
      addEffect('splash', target.x, target.drawY, 60, 0.45);
      addEffect('spark', target.x, target.drawY, 52, 0.4, { grow: true });
      sndGood();
      addBucketFish(target.color);
      setTimeout(() => fishes.push(new Fish({ fromEdge: true, color: orderColor })), 500);
      setTimeout(() => fishes.push(new Fish({ fromEdge: true })), 1200);
      newOrder();
    } else {
      // ちがう色：おこって にげる
      target.escape = 1.2;
      target.scared = 0;
      combo = 0;
      addFloat(target.x, target.drawY - 24, 'ちがうよ', '#fca5a5');
      addEffect('smoke', target.x, target.drawY, 36, 0.35);
      sndWrong();
    }
    updateCombo(); updateHUD();
  });
}
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault(); ensureAudio();
  const r = canvas.getBoundingClientRect();
  onTap(e.clientX - r.left, e.clientY - r.top);
});

function addBucketFish(color) {
  const d = document.createElement('div');
  d.className = 'bucket-fish';
  d.style.cssText += spriteCss(color + '_happy', 26);
  bucket.appendChild(d);
  while (bucket.children.length > 40) bucket.removeChild(bucket.firstChild);
}
function updateHUD() {
  scoreDisplay.textContent = '⭐ ' + score;
  timerDisplay.textContent = '⏰ ' + Math.ceil(timeLeft);
  timerDisplay.classList.toggle('warning', timeLeft <= 10);
}

// ===== ループ =====
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts; tRun += dt; waveT += dt;
  drawScene(ctx);

  if (gameState === 'playing') {
    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; endGame(); }
    updateHUD();
    fishes.forEach(f => f.update(dt));
    fishes = fishes.filter(f => !f.dead);
    // お題の色がいなくなったら補充する
    if (!fishes.some(f => f.color === orderColor && !f.caught)) {
      fishes.push(new Fish({ fromEdge: true, color: orderColor }));
    }
    while (fishes.length < 8) fishes.push(new Fish({ fromEdge: true }));
    bonuses.forEach(b => b.update(dt));
    bonuses = bonuses.filter(b => !b.dead);
    if (Math.random() < dt * 0.2 && bonuses.length < 2) bonuses.push(new Bonus());
    updateHook(dt);
  }
  updateBubbles(dt); updateEffects(dt);

  drawBubbles(ctx);
  fishes.forEach(f => f.draw(ctx));
  bonuses.forEach(b => b.draw(ctx));
  drawHook(ctx);
  drawEffects(ctx);
  requestAnimationFrame(loop);
}

function startGame() {
  ensureAudio();
  score = 0; timeLeft = GAME_TIME; caught = []; combo = 0;
  fishes = []; bubbles = []; effects = []; bonuses = []; floats = []; hook = null;
  for (let i = 0; i < 8; i++) fishes.push(new Fish());
  bucket.innerHTML = '';
  bucket.style.display = 'flex'; hud.style.display = 'flex'; orderBar.style.display = 'flex';
  titleScreen.style.display = 'none'; resultScreen.style.display = 'none';
  orderColor = '';
  newOrder(); updateCombo(); updateHUD();
  gameState = 'playing';
}
function endGame() {
  gameState = 'result'; hook = null;
  finalScore.textContent = score;
  document.getElementById('result-title').textContent =
    score >= 60 ? 'つりめいじん！' : score >= 30 ? 'じょうず！' : 'つれた！';
  resultFishRow.innerHTML = '';
  caught.slice(-24).forEach(c => {
    const d = document.createElement('div');
    d.style.cssText = spriteCss(c + '_happy', 24);
    resultFishRow.appendChild(d);
  });
  resultScreen.style.display = 'flex';
  hud.style.display = 'none'; bucket.style.display = 'none'; orderBar.style.display = 'none';
  sndFan();
}

document.getElementById('retry-btn').addEventListener('click', startGame);
document.addEventListener('contextmenu', e => e.preventDefault());

// タイトル画面を出さずに、絵の用意ができたらそのまま始める
const waitReady = setInterval(() => {
  if (sheetReady) { clearInterval(waitReady); startGame(); }
}, 60);

requestAnimationFrame(loop);
</script>
